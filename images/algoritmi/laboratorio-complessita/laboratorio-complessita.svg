<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Crescita del tempo al crescere di N</text>

  <!-- axes -->
  <line x1="55" y1="330" x2="440" y2="330" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="55" y1="330" x2="55" y2="45" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="335" font-size="13" fill="#828282">N</text>
  <text x="40" y="42" font-size="13" fill="#828282">tempo</text>

  <!-- O(1) constant -->
  <line x1="55" y1="310" x2="430" y2="310" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="435" y="314" font-size="12" fill="#2a7ae2">O(1)</text>

  <!-- O(log n) -->
  <path d="M 55 310 Q 150 260 260 230 T 430 200" fill="none" stroke="#2a7ae2" stroke-width="2.5" stroke-dasharray="1 0" opacity="0.7"/>
  <text x="435" y="200" font-size="12" fill="#2a7ae2">O(log n)</text>

  <!-- O(n) linear -->
  <line x1="55" y1="310" x2="330" y2="55" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="335" y="60" font-size="12" fill="#2a7ae2">O(n)</text>

  <!-- O(n^2) quadratic -->
  <path d="M 55 310 C 150 305, 220 200, 270 60" fill="none" stroke="#f66a0a" stroke-width="3"/>
  <text x="255" y="52" font-size="12" fill="#f66a0a">O(n&#178;)</text>

  <!-- O(2^n) exponential -->
  <path d="M 55 310 C 170 309, 200 260, 215 55" fill="none" stroke="#f66a0a" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="170" y="48" font-size="12" fill="#f66a0a">O(2&#8319;)</text>

  <text x="240" y="365" text-anchor="middle" font-size="13" fill="#828282">stesso hardware, algoritmi diversi:</text>
  <text x="240" y="383" text-anchor="middle" font-size="13" fill="#828282">la complessità determina quanto il tempo cresce con N</text>
</svg>
