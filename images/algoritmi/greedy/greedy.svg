<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f66a0a"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Scelta Greedy: la migliore opzione locale</text>

  <!-- root -->
  <circle cx="240" cy="60" r="18" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="65" text-anchor="middle" font-size="12" fill="#111111">start</text>

  <!-- level 1 branches -->
  <line x1="240" y1="78" x2="120" y2="130" stroke="#828282" stroke-width="1.5"/>
  <line x1="240" y1="78" x2="240" y2="130" stroke="#f66a0a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <line x1="240" y1="78" x2="360" y2="130" stroke="#828282" stroke-width="1.5"/>

  <circle cx="120" cy="145" r="16" fill="white" stroke="#828282" stroke-width="1.5"/>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#828282">+2</text>
  <circle cx="240" cy="145" r="16" fill="#eef2f7" stroke="#f66a0a" stroke-width="2.5"/>
  <text x="240" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">+9</text>
  <circle cx="360" cy="145" r="16" fill="white" stroke="#828282" stroke-width="1.5"/>
  <text x="360" y="150" text-anchor="middle" font-size="11" fill="#828282">+5</text>

  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#f66a0a">scelta migliore</text>

  <!-- level 2 from chosen node -->
  <line x1="240" y1="161" x2="180" y2="215" stroke="#828282" stroke-width="1.5"/>
  <line x1="240" y1="161" x2="240" y2="215" stroke="#f66a0a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <line x1="240" y1="161" x2="300" y2="215" stroke="#828282" stroke-width="1.5"/>

  <circle cx="180" cy="230" r="16" fill="white" stroke="#828282" stroke-width="1.5"/>
  <text x="180" y="235" text-anchor="middle" font-size="11" fill="#828282">+1</text>
  <circle cx="240" cy="230" r="16" fill="#eef2f7" stroke="#f66a0a" stroke-width="2.5"/>
  <text x="240" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">+6</text>
  <circle cx="300" cy="230" r="16" fill="white" stroke="#828282" stroke-width="1.5"/>
  <text x="300" y="235" text-anchor="middle" font-size="11" fill="#828282">+3</text>

  <!-- level 3 -->
  <line x1="240" y1="246" x2="240" y2="285" stroke="#f66a0a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <rect x="195" y="288" width="90" height="34" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="240" y="310" text-anchor="middle" font-size="13" fill="#111111">soluzione</text>

  <text x="240" y="350" text-anchor="middle" font-size="13" fill="#828282">ad ogni passo si sceglie il ramo migliore</text>
  <text x="240" y="368" text-anchor="middle" font-size="13" fill="#828282">senza tornare indietro sulle scelte fatte</text>
</svg>
