<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="240" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Ricerca sequenziale</text>

  <!-- linear search row -->
  <g>
    <rect x="20" y="40" width="46" height="40" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5"/>
    <text x="43" y="65" text-anchor="middle" font-size="14" fill="#828282">3</text>
    <rect x="70" y="40" width="46" height="40" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5"/>
    <text x="93" y="65" text-anchor="middle" font-size="14" fill="#828282">8</text>
    <rect x="120" y="40" width="46" height="40" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5"/>
    <text x="143" y="65" text-anchor="middle" font-size="14" fill="#828282">1</text>
    <rect x="170" y="40" width="46" height="40" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2.5"/>
    <text x="193" y="65" text-anchor="middle" font-size="14" fill="#111111">9</text>
    <rect x="220" y="40" width="46" height="40" rx="6" fill="white" stroke="#828282" stroke-width="1.5" opacity="0.5"/>
    <text x="243" y="65" text-anchor="middle" font-size="14" fill="#828282" opacity="0.5">4</text>
    <rect x="270" y="40" width="46" height="40" rx="6" fill="white" stroke="#828282" stroke-width="1.5" opacity="0.5"/>
    <text x="293" y="65" text-anchor="middle" font-size="14" fill="#828282" opacity="0.5">6</text>
  </g>
  <!-- pointer -->
  <polygon points="193,88 183,105 203,105" fill="#f66a0a"/>
  <text x="193" y="120" text-anchor="middle" font-size="12" fill="#f66a0a">trovato: ricercato=9</text>
  <line x1="45" y1="30" x2="290" y2="30" stroke="#828282" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="167" y="18" text-anchor="middle" font-size="11" fill="#828282">scansione elemento per elemento &#8594;</text>

  <line x1="20" y1="150" x2="460" y2="150" stroke="#828282" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="240" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Ricerca binaria (lista ordinata)</text>

  <!-- binary search halving -->
  <g>
    <rect x="20" y="200" width="440" height="30" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <line x1="240" y1="200" x2="240" y2="230" stroke="#f66a0a" stroke-width="2"/>
    <text x="240" y="220" text-anchor="middle" font-size="12" fill="#111111">mid1</text>
    <text x="470" y="220" font-size="11" fill="#828282">start..end</text>
  </g>

  <line x1="130" y1="230" x2="130" y2="255" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="245" text-anchor="middle" font-size="11" fill="#828282">ricercato &lt; L[mid] &#8594; metà sinistra</text>

  <g>
    <rect x="20" y="258" width="220" height="28" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <line x1="130" y1="258" x2="130" y2="286" stroke="#f66a0a" stroke-width="2"/>
    <text x="130" y="277" text-anchor="middle" font-size="11" fill="#111111">mid2</text>
  </g>

  <line x1="185" y1="286" x2="185" y2="308" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="300" text-anchor="middle" font-size="11" fill="#828282">ricercato &gt; L[mid] &#8594; metà destra</text>

  <g>
    <rect x="130" y="310" width="110" height="26" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2.5"/>
    <text x="185" y="328" text-anchor="middle" font-size="12" fill="#111111">trovato!</text>
  </g>

  <text x="240" y="380" text-anchor="middle" font-size="13" fill="#828282">ad ogni confronto l'intervallo di ricerca</text>
  <text x="240" y="398" text-anchor="middle" font-size="13" fill="#828282">si dimezza: O(log&#8322;N) confronti</text>
</svg>
