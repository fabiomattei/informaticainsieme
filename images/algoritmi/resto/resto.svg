<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Resto greedy: dalla moneta più grande</text>

  <!-- resto da dare box, decreasing -->
  <rect x="170" y="45" width="140" height="44" rx="6" fill="white" stroke="#f66a0a" stroke-width="2.5"/>
  <text x="240" y="63" text-anchor="middle" font-size="12" fill="#828282">resto da dare</text>
  <text x="240" y="82" text-anchor="middle" font-size="16" fill="#111111">30 cent</text>

  <line x1="240" y1="89" x2="240" y2="120" stroke="#828282" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- coin 50 discarded -->
  <g>
    <circle cx="100" cy="150" r="26" fill="#eef2f7" stroke="#828282" stroke-width="1.5"/>
    <text x="100" y="155" text-anchor="middle" font-size="13" fill="#828282">50c</text>
    <text x="100" y="188" text-anchor="middle" font-size="11" fill="#828282">scartata: 50&gt;30</text>
  </g>

  <!-- coin 20 accepted -->
  <g>
    <circle cx="240" cy="150" r="26" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2.5"/>
    <text x="240" y="155" text-anchor="middle" font-size="13" fill="#111111">20c</text>
    <text x="240" y="188" text-anchor="middle" font-size="11" fill="#2a7ae2">data: 30-20=10</text>
  </g>

  <!-- coin 10 accepted -->
  <g>
    <circle cx="380" cy="150" r="26" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2.5"/>
    <text x="380" y="155" text-anchor="middle" font-size="13" fill="#111111">10c</text>
    <text x="380" y="188" text-anchor="middle" font-size="11" fill="#2a7ae2">data: 10-10=0</text>
  </g>

  <line x1="126" y1="150" x2="205" y2="150" stroke="#828282" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="266" y1="150" x2="345" y2="150" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- final result -->
  <line x1="380" y1="176" x2="380" y2="220" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="225" width="270" height="50" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="275" y="245" text-anchor="middle" font-size="12" fill="#828282">monete erogate</text>
  <text x="275" y="264" text-anchor="middle" font-size="14" fill="#111111">1 x 20c + 1 x 10c</text>

  <text x="240" y="310" text-anchor="middle" font-size="13" fill="#828282">ad ogni passo si prova la moneta più grande</text>
  <text x="240" y="328" text-anchor="middle" font-size="13" fill="#828282">disponibile che non superi il resto rimasto</text>
</svg>
