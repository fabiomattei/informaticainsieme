<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="240" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Pattern accumulatore</text>

  <!-- list of values -->
  <g>
    <rect x="20" y="55" width="50" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="45" y="80" text-anchor="middle" font-size="15" fill="#111111">5</text>
    <rect x="80" y="55" width="50" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="105" y="80" text-anchor="middle" font-size="15" fill="#111111">3</text>
    <rect x="140" y="55" width="50" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="165" y="80" text-anchor="middle" font-size="15" fill="#111111">7</text>
    <rect x="200" y="55" width="50" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="225" y="80" text-anchor="middle" font-size="15" fill="#111111">2</text>
    <text x="135" y="47" text-anchor="middle" font-size="12" fill="#828282">lista</text>
  </g>

  <!-- arrow down into accumulator -->
  <line x1="135" y1="100" x2="135" y2="140" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- accumulator box -->
  <rect x="80" y="145" width="120" height="55" rx="6" fill="white" stroke="#f66a0a" stroke-width="2"/>
  <text x="140" y="167" text-anchor="middle" font-size="12" fill="#828282">acc</text>
  <text x="140" y="188" text-anchor="middle" font-size="16" fill="#111111">acc = acc + x</text>

  <!-- snapshots of acc value over iterations -->
  <text x="240" y="230" text-anchor="middle" font-size="13" fill="#828282">evoluzione di acc ad ogni iterazione</text>

  <g>
    <rect x="20" y="250" width="90" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="65" y="275" text-anchor="middle" font-size="14" fill="#111111">acc = 0</text>

    <line x1="110" y1="270" x2="140" y2="270" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="145" y="250" width="90" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="190" y="275" text-anchor="middle" font-size="14" fill="#111111">acc = 5</text>

    <line x1="235" y1="270" x2="265" y2="270" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="270" y="250" width="90" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="315" y="275" text-anchor="middle" font-size="14" fill="#111111">acc = 8</text>

    <line x1="360" y1="270" x2="390" y2="270" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="395" y="250" width="65" height="40" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
    <text x="427" y="275" text-anchor="middle" font-size="14" fill="#111111">17</text>
  </g>

  <text x="240" y="330" text-anchor="middle" font-size="13" fill="#828282">ad ogni passo il valore corrente</text>
  <text x="240" y="348" text-anchor="middle" font-size="13" fill="#828282">si accumula in "acc"</text>
</svg>
