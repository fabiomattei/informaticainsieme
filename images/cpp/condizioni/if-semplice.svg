<svg viewBox="0 0 470 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#828282"/>
    </marker>
  </defs>

  <rect x="110" y="10" width="140" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="180" y="35" font-size="13" text-anchor="middle" fill="#111111">numero letto</text>

  <path d="M 180 50 L 180 78" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <polygon points="180,80 240,120 180,160 120,120" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="180" y="118" font-size="12" text-anchor="middle" fill="#111111">numero &gt; 0?</text>
  <text x="180" y="134" font-size="10" text-anchor="middle" fill="#828282">if</text>

  <path d="M 240 120 L 298 120" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="269" y="112" font-size="11" text-anchor="middle" fill="#2a7ae2">vero</text>

  <rect x="300" y="98" width="150" height="46" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="375" y="116" font-size="12" text-anchor="middle" fill="#111111">stampa</text>
  <text x="375" y="134" font-size="12" text-anchor="middle" fill="#111111">"positivo"</text>

  <path d="M 180 160 L 180 248" stroke="#828282" stroke-width="2" fill="none" marker-end="url(#arrow-grey)"/>
  <text x="196" y="200" font-size="10" fill="#828282">falso</text>

  <path d="M 375 144 C 375 200, 260 210, 222 250" stroke="#828282" stroke-width="2" fill="none" marker-end="url(#arrow-grey)"/>

  <rect x="110" y="250" width="140" height="44" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="180" y="268" font-size="11" text-anchor="middle" fill="#111111">istruzioni</text>
  <text x="180" y="284" font-size="11" text-anchor="middle" fill="#111111">successive</text>

  <text x="20" y="335" font-size="12" fill="#828282">senza else, se la condizione è falsa</text>
  <text x="20" y="353" font-size="12" fill="#828282">il blocco viene semplicemente saltato.</text>
</svg>
