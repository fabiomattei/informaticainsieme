<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="90" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">A &amp;&amp; B</text>
  <g font-size="12" fill="#111111" text-anchor="middle">
    <rect x="20" y="34" width="60" height="26" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <rect x="80" y="34" width="60" height="26" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <rect x="140" y="34" width="60" height="26" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <text x="50" y="52">A</text><text x="110" y="52">B</text><text x="170" y="52">A&amp;&amp;B</text>

    <rect x="20" y="60" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="80" y="60" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="140" y="60" width="60" height="26" fill="#fff5ec" stroke="#f66a0a" stroke-width="1.5"/>
    <text x="50" y="78">T</text><text x="110" y="78">T</text><text x="170" y="78" fill="#f66a0a" font-weight="bold">T</text>

    <rect x="20" y="86" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="80" y="86" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="140" y="86" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <text x="50" y="104">T</text><text x="110" y="104">F</text><text x="170" y="104">F</text>

    <rect x="20" y="112" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="80" y="112" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="140" y="112" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <text x="50" y="130">F</text><text x="110" y="130">T</text><text x="170" y="130">F</text>

    <rect x="20" y="138" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="80" y="138" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="140" y="138" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <text x="50" y="156">F</text><text x="110" y="156">F</text><text x="170" y="156">F</text>
  </g>

  <text x="330" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">A || B</text>
  <g font-size="12" fill="#111111" text-anchor="middle">
    <rect x="260" y="34" width="60" height="26" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <rect x="320" y="34" width="60" height="26" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <rect x="380" y="34" width="60" height="26" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <text x="290" y="52">A</text><text x="350" y="52">B</text><text x="410" y="52">A||B</text>

    <rect x="260" y="60" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="320" y="60" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="380" y="60" width="60" height="26" fill="#fff5ec" stroke="#f66a0a" stroke-width="1.5"/>
    <text x="290" y="78">T</text><text x="350" y="78">T</text><text x="410" y="78" fill="#f66a0a" font-weight="bold">T</text>

    <rect x="260" y="86" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="320" y="86" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="380" y="86" width="60" height="26" fill="#fff5ec" stroke="#f66a0a" stroke-width="1.5"/>
    <text x="290" y="104">T</text><text x="350" y="104">F</text><text x="410" y="104" fill="#f66a0a" font-weight="bold">T</text>

    <rect x="260" y="112" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="320" y="112" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="380" y="112" width="60" height="26" fill="#fff5ec" stroke="#f66a0a" stroke-width="1.5"/>
    <text x="290" y="130">F</text><text x="350" y="130">T</text><text x="410" y="130" fill="#f66a0a" font-weight="bold">T</text>

    <rect x="260" y="138" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="320" y="138" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <rect x="380" y="138" width="60" height="26" fill="#fff" stroke="#828282" stroke-width="1"/>
    <text x="290" y="156">F</text><text x="350" y="156">F</text><text x="410" y="156">F</text>
  </g>

  <line x1="0" y1="182" x2="460" y2="182" stroke="#828282" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="20" y="206" font-size="13" fill="#111111">!true → false     !false → true</text>
  <text x="20" y="226" font-size="12" fill="#828282">short-circuit: A &amp;&amp; B non valuta B se A è falso</text>
  <text x="20" y="244" font-size="12" fill="#828282">A || B non valuta B se A è vero</text>
</svg>
