<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="14" font-weight="bold" fill="#111111">precedenza degli operatori</text>
  <text x="330" y="24" font-size="11" fill="#828282" text-anchor="middle">alta</text>

  <rect x="20"  y="34" width="360" height="34" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="200" y="56" font-size="13" text-anchor="middle" fill="#111111">++  --  (prefisso)</text>

  <rect x="20"  y="76" width="360" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="200" y="98" font-size="13" text-anchor="middle" fill="#111111">*  /  %</text>

  <rect x="20"  y="118" width="360" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="200" y="140" font-size="13" text-anchor="middle" fill="#111111">+  -</text>

  <rect x="20"  y="160" width="360" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="200" y="182" font-size="13" text-anchor="middle" fill="#111111">&lt;  &gt;  &lt;=  &gt;=</text>

  <rect x="20"  y="202" width="360" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="200" y="224" font-size="13" text-anchor="middle" fill="#111111">==  !=</text>

  <rect x="20"  y="244" width="360" height="34" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="2"/>
  <text x="200" y="266" font-size="13" text-anchor="middle" fill="#111111">=  +=  -=  *=  /=  %=</text>

  <text x="330" y="292" font-size="11" fill="#828282" text-anchor="middle">bassa</text>
  <path d="M 385 40 L 385 270" stroke="#828282" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="316" font-size="12" fill="#828282">2 + 3 * 4 = 14   (non 20: * prima di +)</text>
</svg>
