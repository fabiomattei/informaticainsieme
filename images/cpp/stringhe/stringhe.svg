<svg viewBox="0 0 440 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="14" font-weight="bold" fill="#111111">string parola = "liceo";</text>

  <rect x="20" y="36" width="360" height="60" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <g font-size="16" fill="#111111" text-anchor="middle">
    <text x="56"  y="72">l</text>
    <text x="128" y="72">i</text>
    <text x="200" y="72">c</text>
    <text x="272" y="72">e</text>
    <text x="344" y="72">o</text>
  </g>
  <line x1="92"  y1="36" x2="92"  y2="96" stroke="#2a7ae2" stroke-width="1"/>
  <line x1="164" y1="36" x2="164" y2="96" stroke="#2a7ae2" stroke-width="1"/>
  <line x1="236" y1="36" x2="236" y2="96" stroke="#2a7ae2" stroke-width="1"/>
  <line x1="308" y1="36" x2="308" y2="96" stroke="#2a7ae2" stroke-width="1"/>

  <g font-size="11" fill="#828282" text-anchor="middle">
    <text x="56"  y="112">[0] front()</text>
    <text x="128" y="112">[1]</text>
    <text x="200" y="112">[2]</text>
    <text x="272" y="112">[3]</text>
    <text x="344" y="112">[4] back()</text>
  </g>

  <rect x="20" y="140" width="200" height="34" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="120" y="162" font-size="13" text-anchor="middle" fill="#111111">.length() → 5</text>

  <text x="20" y="204" font-size="12" fill="#111111">gestita internamente: nessun '\0' da pensare,</text>
  <text x="20" y="222" font-size="12" fill="#828282">memoria e dimensione gestite dalla classe string.</text>
  <text x="20" y="244" font-size="12" fill="#828282">.substr() .find() .replace() .insert() .erase()</text>
</svg>
