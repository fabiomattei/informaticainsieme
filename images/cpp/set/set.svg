<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#111111">set&lt;int&gt; A = {1,2,3,4,5}</text>
  <text x="20" y="40" font-size="12" fill="#828282">set&lt;int&gt; B = {3,4,5,6,7}</text>

  <circle cx="150" cy="140" r="90" fill="#eef2f7" fill-opacity="0.7" stroke="#2a7ae2" stroke-width="2"/>
  <circle cx="260" cy="140" r="90" fill="#fff5ec" fill-opacity="0.7" stroke="#f66a0a" stroke-width="2"/>

  <text x="95"  y="140" font-size="14" text-anchor="middle" fill="#111111">1</text>
  <text x="95"  y="165" font-size="14" text-anchor="middle" fill="#111111">2</text>
  <text x="315" y="140" font-size="14" text-anchor="middle" fill="#111111">6</text>
  <text x="315" y="165" font-size="14" text-anchor="middle" fill="#111111">7</text>

  <text x="205" y="120" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">3</text>
  <text x="205" y="145" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">4</text>
  <text x="205" y="170" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">5</text>

  <text x="150" y="80"  font-size="12" text-anchor="middle" fill="#2a7ae2">A</text>
  <text x="260" y="80"  font-size="12" text-anchor="middle" fill="#f66a0a">B</text>
  <text x="205" y="250" font-size="12" text-anchor="middle" fill="#828282">intersezione: {3,4,5}</text>

  <line x1="0" y1="270" x2="420" y2="270" stroke="#828282" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="20" y="292" font-size="12" fill="#111111">elementi unici e sempre ordinati</text>
  <text x="20" y="310" font-size="12" fill="#828282">insert("mela") già presente → ignorato silenziosamente</text>
</svg>
