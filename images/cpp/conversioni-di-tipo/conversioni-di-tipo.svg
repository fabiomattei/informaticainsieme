<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="14" font-weight="bold" fill="#111111">implicita (automatica)</text>
  <rect x="20" y="34" width="120" height="50" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="80" y="55" font-size="12" text-anchor="middle" fill="#111111">int</text>
  <text x="80" y="72" font-size="12" text-anchor="middle" fill="#111111">interi = 7</text>

  <path d="M 140 59 L 190 59" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="165" y="50" font-size="10" text-anchor="middle" fill="#2a7ae2">widening</text>

  <rect x="190" y="34" width="130" height="50" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="255" y="55" font-size="12" text-anchor="middle" fill="#111111">double</text>
  <text x="255" y="72" font-size="12" text-anchor="middle" fill="#111111">decimale = 7</text>

  <text x="340" y="65" font-size="11" fill="#828282">nessuna perdita</text>

  <line x1="0" y1="106" x2="460" y2="106" stroke="#828282" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="20" y="132" font-size="14" font-weight="bold" fill="#111111">esplicita — static_cast&lt;tipo&gt;()</text>
  <rect x="20" y="142" width="130" height="50" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="85" y="163" font-size="12" text-anchor="middle" fill="#111111">double</text>
  <text x="85" y="180" font-size="12" text-anchor="middle" fill="#111111">pi = 3.14</text>

  <path d="M 150 167 L 210 167" stroke="#f66a0a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="180" y="156" font-size="10" text-anchor="middle" fill="#f66a0a">static_cast&lt;int&gt;</text>

  <rect x="210" y="142" width="120" height="50" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="270" y="163" font-size="12" text-anchor="middle" fill="#111111">int</text>
  <text x="270" y="180" font-size="12" text-anchor="middle" fill="#111111">tronco = 3</text>

  <text x="20" y="216" font-size="12" fill="#828282">la parte decimale (.14) viene scartata,</text>
  <text x="20" y="234" font-size="12" fill="#828282">non arrotondata: possibile perdita di dati.</text>

  <line x1="0" y1="252" x2="460" y2="252" stroke="#828282" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="20" y="276" font-size="13" fill="#111111">stoi("42") → int      to_string(42) → "42"</text>
  <text x="20" y="296" font-size="12" fill="#828282">stringa ↔ numero tramite funzioni della libreria &lt;string&gt;</text>
</svg>
