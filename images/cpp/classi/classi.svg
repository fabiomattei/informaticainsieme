<svg viewBox="0 0 460 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="15" font-weight="bold" fill="#111111">class Persona</text>
  <rect x="20" y="34" width="220" height="150" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <line x1="20" y1="94" x2="240" y2="94" stroke="#2a7ae2" stroke-width="1"/>
  <line x1="20" y1="150" x2="240" y2="150" stroke="#2a7ae2" stroke-width="1"/>

  <text x="30" y="52" font-size="11" fill="#f66a0a" font-weight="bold">private:</text>
  <text x="30" y="70" font-size="13" fill="#111111">string nome</text>
  <text x="30" y="88" font-size="13" fill="#111111">int eta</text>

  <text x="30" y="110" font-size="11" fill="#f66a0a" font-weight="bold">public:</text>
  <text x="30" y="128" font-size="13" fill="#111111">Persona(n, e)</text>
  <text x="30" y="146" font-size="13" fill="#111111">presenta()</text>

  <text x="30" y="170" font-size="11" fill="#828282">costruttore + metodo pubblico</text>

  <path d="M 130 184 L 130 214" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="145" y="204" font-size="12" fill="#2a7ae2">istanzia</text>

  <rect x="20" y="220" width="200" height="50" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="120" y="240" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111">p1 : Persona</text>
  <text x="120" y="258" font-size="12" text-anchor="middle" fill="#111111">nome="Alice", eta=30</text>

  <rect x="240" y="220" width="200" height="50" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="340" y="240" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111">p2 : Persona</text>
  <text x="340" y="258" font-size="12" text-anchor="middle" fill="#111111">nome="Bob", eta=25</text>

  <path d="M 240 108 L 250 108" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 260 100 L 340 220" stroke="#2a7ae2" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <text x="20" y="304" font-size="12" fill="#828282">ogni oggetto ha la propria copia degli attributi,</text>
  <text x="20" y="320" font-size="12" fill="#828282">ma condivide gli stessi metodi della classe.</text>
</svg>
