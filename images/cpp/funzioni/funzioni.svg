<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="30" y="60" font-size="13" fill="#111111" text-anchor="middle">int a = 3</text>
  <rect x="0" y="70" width="70" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="35" y="92" font-size="13" text-anchor="middle" fill="#111111">int a</text>

  <text x="30" y="140" font-size="13" fill="#111111" text-anchor="middle">int b = 7</text>
  <rect x="0" y="150" width="70" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="35" y="172" font-size="13" text-anchor="middle" fill="#111111">int b</text>

  <path d="M 70 87 L 140 100" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 70 167 L 140 130" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="140" y="60" width="180" height="140" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="3"/>
  <text x="230" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">somma(a, b)</text>
  <text x="230" y="132" font-size="13" text-anchor="middle" fill="#828282">return a + b;</text>
  <text x="230" y="175" font-size="11" text-anchor="middle" fill="#828282">"black box"</text>

  <path d="M 320 130 L 390 130" stroke="#f66a0a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="390" y="105" width="60" height="50" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="420" y="127" font-size="12" text-anchor="middle" fill="#111111">int</text>
  <text x="420" y="145" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111">10</text>

  <text x="20" y="230" font-size="12" fill="#828282">tipi dei parametri e del valore di ritorno sono</text>
  <text x="20" y="248" font-size="12" fill="#828282">dichiarati esplicitamente: int somma(int a, int b)</text>
</svg>
