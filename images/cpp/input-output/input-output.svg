<svg viewBox="0 0 460 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <rect x="150" y="90" width="160" height="100" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="3"/>
  <text x="230" y="130" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">programma</text>
  <text x="230" y="150" font-size="12" text-anchor="middle" fill="#828282">int eta;</text>
  <text x="230" y="168" font-size="12" text-anchor="middle" fill="#828282">variabile eta</text>

  <rect x="20" y="20" width="140" height="46" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="90" y="48" font-size="13" text-anchor="middle" fill="#111111">terminale</text>

  <path d="M 90 66 C 90 100, 150 120, 150 130" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="100" y="100" font-size="12" fill="#2a7ae2">cin &gt;&gt; eta;</text>
  <text x="100" y="115" font-size="10" fill="#828282">input dell'utente</text>

  <rect x="300" y="20" width="140" height="46" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="370" y="48" font-size="13" text-anchor="middle" fill="#111111">terminale</text>

  <path d="M 310 130 C 310 100, 300 66, 340 66" stroke="#f66a0a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="315" y="100" font-size="12" fill="#f66a0a">cout &lt;&lt; eta;</text>
  <text x="330" y="115" font-size="10" fill="#828282">output a schermo</text>

  <text x="20" y="230" font-size="12" fill="#828282">&gt;&gt; estrae dati da cin (input)</text>
  <text x="20" y="248" font-size="12" fill="#828282">&lt;&lt; invia dati a cout (output)</text>
</svg>
