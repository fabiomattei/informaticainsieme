<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#111111">array di char terminato da '\0'</text>

  <g stroke="#2a7ae2" stroke-width="2" fill="#eef2f7">
    <rect x="20"  y="44" width="50" height="50" rx="6"/>
    <rect x="70"  y="44" width="50" height="50" rx="6"/>
    <rect x="120" y="44" width="50" height="50" rx="6"/>
    <rect x="170" y="44" width="50" height="50" rx="6"/>
  </g>
  <rect x="220" y="44" width="50" height="50" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>

  <g font-size="16" fill="#111111" text-anchor="middle">
    <text x="45"  y="74">M</text>
    <text x="95"  y="74">a</text>
    <text x="145" y="74">r</text>
    <text x="195" y="74">o</text>
    <text x="245" y="74" fill="#f66a0a" font-weight="bold">\0</text>
  </g>
  <g font-size="12" fill="#828282" text-anchor="middle">
    <text x="45"  y="112">[0]</text>
    <text x="95"  y="112">[1]</text>
    <text x="145" y="112">[2]</text>
    <text x="195" y="112">[3]</text>
    <text x="245" y="112">[4]</text>
  </g>
  <text x="245" y="130" font-size="12" fill="#f66a0a" text-anchor="middle">terminatore</text>

  <text x="20" y="160" font-size="13" fill="#828282">char nome[5] = "Maro";  // 4 lettere + '\0' = 5 byte</text>

  <line x1="20" y1="176" x2="460" y2="176" stroke="#828282" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="20" y="200" font-size="15" font-weight="bold" fill="#111111">std::string — gestisce tutto da sola</text>
  <rect x="20" y="212" width="300" height="36" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="170" y="235" font-size="15" fill="#111111" text-anchor="middle">string nome = "Mario";</text>
  <text x="340" y="235" font-size="12" fill="#828282">niente '\0' da gestire a mano</text>
</svg>
