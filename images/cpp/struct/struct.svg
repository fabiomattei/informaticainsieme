<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="14" font-weight="bold" fill="#111111">struct Punto { double x; double y; }</text>

  <rect x="20" y="36" width="200" height="70" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <line x1="120" y1="36" x2="120" y2="106" stroke="#2a7ae2" stroke-width="1"/>
  <text x="70" y="60" font-size="12" text-anchor="middle" fill="#828282">x : double</text>
  <text x="70" y="82" font-size="15" text-anchor="middle" fill="#111111">3.0</text>
  <text x="170" y="60" font-size="12" text-anchor="middle" fill="#828282">y : double</text>
  <text x="170" y="82" font-size="15" text-anchor="middle" fill="#111111">4.0</text>

  <text x="20" y="126" font-size="11" fill="#828282">campi contigui in memoria — accesso con il punto: p1.x</text>

  <path d="M 120 106 L 120 150" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="140" y="140" font-size="11" fill="#2a7ae2">membri pubblici</text>

  <rect x="20" y="150" width="200" height="30" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="120" y="170" font-size="12" text-anchor="middle" fill="#111111">distanzaDallOrigine()</text>

  <line x1="0" y1="200" x2="400" y2="200" stroke="#828282" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="20" y="224" font-size="13" font-weight="bold" fill="#111111">vector&lt;Studente&gt; — tabella di record</text>
  <g font-size="12" fill="#111111" text-anchor="middle">
    <rect x="20"  y="234" width="90" height="30" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <text x="65" y="254">Alice, 9</text>
    <rect x="110" y="234" width="90" height="30" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <text x="155" y="254">Bruno, 6</text>
    <rect x="200" y="234" width="90" height="30" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <text x="245" y="254">Carla, 8</text>
  </g>

  <text x="20" y="286" font-size="12" fill="#828282">a differenza di class, i campi sono pubblici per default</text>
</svg>
