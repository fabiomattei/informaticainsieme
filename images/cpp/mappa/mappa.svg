<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="14" font-weight="bold" fill="#111111">map&lt;string, int&gt; voti</text>

  <g font-size="13" fill="#111111">
    <rect x="20"  y="40" width="140" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="90" y="65" text-anchor="middle">"fisica"</text>
    <path d="M 160 60 L 210 60" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="210" y="40" width="70" height="40" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
    <text x="245" y="65" text-anchor="middle">8</text>

    <rect x="20"  y="90" width="140" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="90" y="115" text-anchor="middle">"matematica"</text>
    <path d="M 160 110 L 210 110" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="210" y="90" width="70" height="40" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
    <text x="245" y="115" text-anchor="middle">6</text>

    <rect x="20"  y="140" width="140" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="90" y="165" text-anchor="middle">"storia"</text>
    <path d="M 160 160 L 210 160" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="210" y="140" width="70" height="40" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
    <text x="245" y="165" text-anchor="middle">7</text>
  </g>

  <text x="300" y="60"  font-size="11" fill="#828282">chiave</text>
  <text x="245" y="34"  font-size="11" fill="#828282" text-anchor="middle">valore</text>

  <line x1="0" y1="200" x2="400" y2="200" stroke="#828282" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="20" y="224" font-size="12" fill="#111111">chiavi uniche, ordinate automaticamente</text>
  <text x="20" y="242" font-size="12" fill="#828282">voti["fisica"] → accesso diretto per chiave</text>
  <text x="20" y="260" font-size="12" fill="#828282">.count(k) / .find(k) → verifica senza creare</text>

  <text x="20" y="296" font-size="12" fill="#f66a0a">attenzione: voti["nuova"] crea la chiave se assente!</text>
</svg>
