<svg viewBox="0 0 380 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <!-- init -->
  <rect x="90" y="14" width="200" height="42" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="190" y="40" font-size="14" text-anchor="middle" fill="#111111">int i = 1</text>

  <path d="M 190 56 L 190 82" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- condition diamond -->
  <polygon points="190,82 280,132 190,182 100,132" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="190" y="128" font-size="13" text-anchor="middle" fill="#111111">i &lt;= 5 ?</text>
  <text x="190" y="146" font-size="11" text-anchor="middle" fill="#828282">condizione</text>

  <!-- true path down to body -->
  <path d="M 190 182 L 190 210" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="204" y="200" font-size="12" fill="#2a7ae2">vero</text>

  <!-- body -->
  <rect x="70" y="210" width="240" height="46" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="190" y="238" font-size="14" text-anchor="middle" fill="#111111">cout &lt;&lt; i &lt;&lt; endl;</text>

  <path d="M 190 256 L 190 282" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- update -->
  <rect x="90" y="282" width="200" height="42" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="190" y="308" font-size="14" text-anchor="middle" fill="#111111">i++</text>

  <!-- loop back -->
  <path d="M 90 303 C 30 303, 30 132, 100 132" stroke="#2a7ae2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- false path -->
  <path d="M 280 132 L 330 132 L 330 350" stroke="#f66a0a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="298" y="122" font-size="12" fill="#f66a0a">falso</text>

  <rect x="230" y="350" width="150" height="42" rx="6" fill="#fff5ec" stroke="#f66a0a" stroke-width="2"/>
  <text x="305" y="376" font-size="14" text-anchor="middle" fill="#111111">fine ciclo</text>

  <text x="20" y="440" font-size="12" fill="#828282">for (int i = 1; i &lt;= 5; i++) { ... }</text>
  <text x="20" y="460" font-size="12" fill="#828282">init · condizione · aggiornamento in una riga</text>
</svg>
