<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Client TCP e Server TCP</text>

  <!-- client box -->
  <rect x="30" y="50" width="140" height="90" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="100" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">client.py</text>
  <text x="100" y="92" text-anchor="middle" font-size="10" font-family="monospace" fill="#828282">socket.socket()</text>
  <text x="100" y="108" text-anchor="middle" font-size="10" font-family="monospace" fill="#828282">s.connect()</text>
  <text x="100" y="124" text-anchor="middle" font-size="10" font-family="monospace" fill="#828282">s.send() / s.recv()</text>

  <!-- server box -->
  <rect x="310" y="50" width="140" height="120" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="380" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">server.py</text>
  <text x="380" y="92" text-anchor="middle" font-size="10" font-family="monospace" fill="#828282">s.bind()</text>
  <text x="380" y="108" text-anchor="middle" font-size="10" font-family="monospace" fill="#828282">s.listen()</text>
  <text x="380" y="124" text-anchor="middle" font-size="10" font-family="monospace" fill="#828282">s.accept()</text>
  <text x="380" y="140" text-anchor="middle" font-size="10" font-family="monospace" fill="#828282">subprocess.run()</text>
  <text x="380" y="156" text-anchor="middle" font-size="10" font-family="monospace" fill="#828282">conn.sendall()</text>

  <!-- request arrow -->
  <path d="M170,95 L305,95" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="88" text-anchor="middle" font-size="11" fill="#2a7ae2">richiesta: comando</text>

  <!-- response arrow -->
  <path d="M305,125 L170,125" fill="none" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="146" text-anchor="middle" font-size="11" fill="#f66a0a">risposta: output</text>

  <!-- terminal snippet -->
  <rect x="60" y="190" width="360" height="90" rx="6" fill="#111111" stroke="#828282" stroke-width="1.5"/>
  <text x="76" y="212" font-size="11" font-family="monospace" fill="#2a7ae2">-&gt; dir</text>
  <text x="76" y="230" font-size="10" font-family="monospace" fill="#828282">Connessione al Server: (IP, 20000) effettuata.</text>
  <text x="76" y="248" font-size="10" font-family="monospace" fill="#f66a0a">Volume in unità C ...</text>
  <text x="76" y="266" font-size="10" font-family="monospace" fill="#f66a0a">directory.txt file.py</text>

  <text x="240" y="308" text-anchor="middle" font-size="12" fill="#828282">il client invia comandi, il server li esegue e ne rimanda il risultato</text>
</svg>
