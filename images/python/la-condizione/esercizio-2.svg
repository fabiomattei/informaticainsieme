<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e05252"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>
  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" font-weight="600">Esercizio 2: manca l'indentazione</text>

  <rect x="160" y="55" width="160" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111">if b &gt; a:</text>

  <line x1="240" y1="95" x2="240" y2="150" stroke="#e05252" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="252" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#e05252">print(...) non indentato</text>

  <rect x="130" y="155" width="220" height="50" rx="6" fill="#f66a0a" fill-opacity="0.12" stroke="#f66a0a" stroke-width="2"/>
  <text x="240" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111" font-weight="600">IndentationError</text>
  <text x="240" y="193" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#111111">il programma non parte, qualsiasi sia a o b</text>

  <line x1="240" y1="205" x2="240" y2="248" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <ellipse cx="240" cy="270" rx="50" ry="22" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Fine</text>

  <text x="240" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">errore rilevato prima dell'esecuzione</text>
</svg>
