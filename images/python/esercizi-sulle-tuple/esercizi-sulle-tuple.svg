  <text x="265" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">2</text>

  <!-- outer parenthesis-like container -->
  <path d="M75,80 q-15,35 0,70" fill="none" stroke="#2a7ae2" stroke-width="2.5"/>
  <path d="M345,80 q15,35 0,70" fill="none" stroke="#2a7ae2" stroke-width="2.5"/>

