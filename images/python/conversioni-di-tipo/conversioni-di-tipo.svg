<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f66a0a"/>
    </marker>
  </defs>
  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" font-weight="600">Conversioni tra tipi</text>

  <!-- str box -->
  <rect x="30" y="80" width="130" height="60" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="95" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">str</text>
  <text x="95" y="124" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#111111">"42"</text>

  <line x1="160" y1="110" x2="220" y2="110" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2a7ae2">int()</text>

  <!-- int box -->
  <rect x="225" y="80" width="130" height="60" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="290" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">int</text>
  <text x="290" y="124" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#111111">42</text>

  <line x1="355" y1="110" x2="415" y2="110" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="385" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#f66a0a">float()</text>

  <!-- float box -->
  <rect x="330" y="150" width="130" height="60" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="395" y="173" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">float</text>
  <text x="395" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#111111">42.0</text>

  <!-- back to str -->
  <path d="M330,180 C160,220 60,180 60,145" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2a7ae2">str()</text>

  <text x="240" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">int("42") → 42     type(x) rivela il tipo</text>
  <text x="240" y="284" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">chr(65) ↔ ord('A')  bool(0) = False</text>
  <text x="240" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">input() restituisce sempre una str</text>
</svg>
