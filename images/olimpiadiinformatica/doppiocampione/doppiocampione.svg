<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Doppio campione: campA e campB</text>

  <!-- list S -->
  <g font-size="13" fill="#111111">
    <rect x="15" y="50" width="36" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="33" y="72" text-anchor="middle">4</text>
    <rect x="55" y="50" width="36" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="73" y="72" text-anchor="middle">5</text>
    <rect x="95" y="50" width="36" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="113" y="72" text-anchor="middle">7</text>
    <rect x="135" y="50" width="36" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="153" y="72" text-anchor="middle">3</text>
    <rect x="175" y="50" width="36" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="193" y="72" text-anchor="middle">4</text>
    <rect x="215" y="50" width="36" height="34" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2.5"/>
    <text x="233" y="72" text-anchor="middle">9</text>
    <rect x="255" y="50" width="36" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="273" y="72" text-anchor="middle">3</text>
    <rect x="295" y="50" width="36" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="313" y="72" text-anchor="middle">5</text>
    <rect x="335" y="50" width="36" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
    <text x="353" y="72" text-anchor="middle">7</text>
  </g>
  <text x="15" y="42" font-size="12" fill="#828282">S</text>

  <line x1="233" y1="84" x2="233" y2="120" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- campA and campB boxes -->
  <rect x="130" y="125" width="130" height="55" rx="6" fill="white" stroke="#f66a0a" stroke-width="2.5"/>
  <text x="195" y="147" text-anchor="middle" font-size="12" fill="#828282">campA (max)</text>
  <text x="195" y="168" text-anchor="middle" font-size="17" fill="#111111">9</text>

  <rect x="280" y="125" width="130" height="55" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="345" y="147" text-anchor="middle" font-size="12" fill="#828282">campB (secondo max)</text>
  <text x="345" y="168" text-anchor="middle" font-size="17" fill="#111111">7</text>

  <path d="M 195 180 C 195 210, 280 210, 280 180" fill="none" stroke="#828282" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="215" text-anchor="middle" font-size="11" fill="#828282">il vecchio campA diventa campB</text>

  <text x="240" y="255" text-anchor="middle" font-size="13" fill="#828282">quando un nuovo valore supera campA,</text>
  <text x="240" y="273" text-anchor="middle" font-size="13" fill="#828282">il vecchio campA scivola in campB</text>
  <text x="240" y="291" text-anchor="middle" font-size="13" fill="#828282">e il nuovo valore diventa campA</text>

  <rect x="150" y="305" width="180" height="34" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="240" y="327" text-anchor="middle" font-size="13" fill="#111111">risultato: campA=9, campB=7</text>
</svg>
