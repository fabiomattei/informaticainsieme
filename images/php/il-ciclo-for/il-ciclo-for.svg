<svg viewBox="0 0 420 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>
  <text x="210" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" font-weight="600">for ($i = 0; $i &lt; n; $i++)</text>

  <!-- start -->
  <rect x="140" y="45" width="140" height="36" rx="18" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="210" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111">$i = 0</text>

  <line x1="210" y1="81" x2="210" y2="110" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- diamond -->
  <polygon points="210,105 300,150 210,195 120,150" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="210" y="153" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">$i &lt; n ?</text>

  <!-- yes -> body -->
  <line x1="210" y1="195" x2="210" y2="230" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">vero</text>

  <rect x="120" y="230" width="180" height="70" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="210" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">echo $numeri[$i];</text>
  <text x="210" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">$i++</text>

  <!-- loop back -->
  <path d="M120,265 C60,265 60,150 118,150" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- no -> end -->
  <line x1="300" y1="150" x2="360" y2="150" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">falso</text>
  <line x1="360" y1="150" x2="360" y2="350" stroke="#2a7ae2" stroke-width="2"/>
  <line x1="360" y1="350" x2="280" y2="350" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="330" width="130" height="40" rx="20" fill="#f66a0a" fill-opacity="0.12" stroke="#f66a0a" stroke-width="2"/>
  <text x="215" y="355" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111">fine ciclo</text>

  <text x="210" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">inizializzazione, condizione e incremento</text>
  <text x="210" y="443" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">stanno tutte sulla riga del for</text>
</svg>
