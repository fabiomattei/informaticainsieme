<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Prima configurazione</text>

  <rect x="30" y="48" width="420" height="120" rx="6" fill="#1e1e1e"/>
  <circle cx="48" cy="63" r="4" fill="#828282"/>
  <circle cx="62" cy="63" r="4" fill="#828282"/>
  <circle cx="76" cy="63" r="4" fill="#828282"/>
  <text x="48" y="92" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#f66a0a">$ git config --global user.name "Mario Rossi"</text>
  <text x="48" y="116" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#f66a0a">$ git config --global user.email "mario@example.com"</text>
  <text x="48" y="146" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#ffffff">$ git --version</text>
  <text x="48" y="164" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#828282">git version 2.4x.x</text>

  <text x="240" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">questi dati vengono associati a ogni commit</text>

  <!-- two paths: init vs clone -->
  <rect x="30" y="220" width="190" height="100" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="125" y="244" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="600" fill="#111111">git init</text>
  <text x="125" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">parti da una cartella</text>
  <text x="125" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">vuota sul tuo computer</text>
  <text x="125" y="304" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">crea la cartella .git</text>

  <rect x="260" y="220" width="190" height="100" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="355" y="244" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="600" fill="#111111">git clone &lt;url&gt;</text>
  <text x="355" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">parti da un repository</text>
  <text x="355" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">già esistente (es. GitHub)</text>
  <text x="355" y="304" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">scarica file + cronologia</text>
</svg>
