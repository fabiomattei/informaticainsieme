  <path d="M230,90 C230,175 385,175 385,90" fill="none" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="307" y="196" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#f66a0a">git diff --staged</text>

  <text x="230" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">ognuno confronta due punti diversi della catena</text>
