<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f66a0a"/>
    </marker>
  </defs>
  <text x="240" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Quale comando usare?</text>

  <rect x="20" y="46" width="120" height="46" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="2"/>
  <text x="80" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111111">working dir</text>

  <rect x="190" y="46" width="120" height="46" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="2"/>
  <text x="250" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111111">staging area</text>

  <rect x="360" y="46" width="100" height="46" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="2"/>
  <text x="410" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111111">repository</text>

  <line x1="140" y1="69" x2="185" y2="69" stroke="#828282" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="69" x2="355" y2="69" stroke="#828282" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- restore -->
  <line x1="80" y1="46" x2="80" y2="108" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="80" y="122" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#2a7ae2">restore</text>
  <text x="80" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#828282">scarta modifiche</text>

  <!-- restore --staged -->
  <line x1="250" y1="46" x2="250" y2="108" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="122" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#2a7ae2">restore --staged</text>
  <text x="250" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#828282">toglie dallo staging</text>

  <!-- reset / revert -->
  <line x1="410" y1="46" x2="410" y2="108" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="410" y="122" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#f66a0a">reset / revert</text>
  <text x="410" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#828282">annullano un commit</text>

  <line x1="0" y1="160" x2="480" y2="160" stroke="#eef2f7" stroke-width="2"/>

  <!-- reset vs revert -->
  <rect x="30" y="180" width="190" height="80" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="125" y="204" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#111111">git reset</text>
  <text x="125" y="224" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">riscrive la cronologia</text>
  <text x="125" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">solo su commit locali</text>

  <rect x="260" y="180" width="190" height="80" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="355" y="204" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#111111">git revert</text>
  <text x="355" y="224" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">crea un nuovo commit</text>
  <text x="355" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">sicuro su commit condivisi</text>

  <!-- stash -->
  <rect x="30" y="278" width="420" height="60" rx="6" fill="#1e1e1e"/>
  <text x="48" y="302" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#f66a0a">$ git stash</text>
  <text x="160" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">mette da parte le modifiche non salvate</text>
  <text x="48" y="322" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#ffffff">$ git stash pop</text>
  <text x="185" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">le fa tornare indietro</text>
</svg>
