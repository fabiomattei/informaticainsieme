<svg viewBox="0 0 460 280" xmlns="http://www.w3.org/2000/svg">
  <text x="230" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111">Le tre modalità di git reset</text>

  <text x="80" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">working</text>
  <text x="230" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">staging</text>
  <text x="380" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">commit annullato</text>

  <!-- soft -->
  <text x="20" y="86" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#2a7ae2" font-weight="600">--soft</text>
  <rect x="60" y="66" width="40" height="30" rx="4" fill="#ffffff" stroke="#d3d3d3" stroke-width="1.5"/>
  <rect x="210" y="66" width="40" height="30" rx="4" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <rect x="360" y="66" width="40" height="30" rx="4" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>

  <!-- mixed -->
  <text x="20" y="132" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#f66a0a" font-weight="600">--mixed</text>
  <rect x="60" y="112" width="40" height="30" rx="4" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <rect x="210" y="112" width="40" height="30" rx="4" fill="#ffffff" stroke="#d3d3d3" stroke-width="1.5"/>
  <rect x="360" y="112" width="40" height="30" rx="4" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>

  <!-- hard -->
  <text x="20" y="178" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#828282" font-weight="600">--hard</text>
  <rect x="60" y="158" width="40" height="30" rx="4" fill="#ffffff" stroke="#d3d3d3" stroke-width="1.5"/>
  <rect x="210" y="158" width="40" height="30" rx="4" fill="#ffffff" stroke="#d3d3d3" stroke-width="1.5"/>
  <rect x="360" y="158" width="40" height="30" rx="4" fill="#ffffff" stroke="#d3d3d3" stroke-width="1.5"/>
  <text x="380" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#f66a0a">eliminato per sempre</text>

  <text x="230" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">il riquadro colorato indica dove restano le modifiche</text>
  <text x="230" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">dopo aver annullato l'ultimo commit</text>
</svg>
