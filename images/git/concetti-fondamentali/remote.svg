      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>
  <text x="230" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111">Il remote "origin"</text>

  <rect x="30" y="60" width="150" height="60" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="2"/>
  <text x="105" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111111">repository</text>
  <text x="105" y="111" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">sul tuo computer</text>

  <line x1="180" y1="90" x2="270" y2="90" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
