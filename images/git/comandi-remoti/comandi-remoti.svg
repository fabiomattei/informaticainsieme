<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f66a0a"/>
    </marker>
  </defs>
  <text x="240" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Repository locale e remoto</text>

  <rect x="50" y="55" width="150" height="70" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="125" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111111">repository</text>
  <text x="125" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111111">locale</text>

  <rect x="280" y="55" width="150" height="70" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="355" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111111">origin</text>
  <text x="355" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111111">(GitHub)</text>

  <line x1="200" y1="78" x2="278" y2="78" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="239" y="68" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#2a7ae2" font-weight="600">push</text>

  <line x1="278" y1="102" x2="200" y2="102" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="239" y="118" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#f66a0a" font-weight="600">pull / fetch</text>

  <text x="240" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">pull = fetch + merge automatico</text>

  <line x1="0" y1="172" x2="480" y2="172" stroke="#eef2f7" stroke-width="2"/>

  <!-- workflow terminal -->
  <rect x="30" y="192" width="420" height="130" rx="6" fill="#1e1e1e"/>
  <text x="48" y="218" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#f66a0a">$ git pull</text>
  <text x="150" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">mi aggiorno</text>
  <text x="48" y="242" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#ffffff">$ git switch -c nuova-funzionalita</text>
  <text x="48" y="266" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#ffffff">$ git add . &amp;&amp; git commit -m "..."</text>
  <text x="48" y="292" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#f66a0a">$ git push -u origin nuova-funzionalita</text>
  <text x="48" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">invio il branch al remote</text>
</svg>
