<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f66a0a"/>
    </marker>
  </defs>
  <text x="230" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111">fetch vs pull</text>

  <text x="80" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">origin</text>
  <text x="230" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">dati scaricati</text>
  <text x="380" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">tuo branch locale</text>

  <rect x="50" y="66" width="60" height="34" rx="4" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="80" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#111111">remoto</text>

  <line x1="112" y1="83" x2="200" y2="83" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="156" y="74" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#f66a0a">fetch</text>

  <rect x="200" y="66" width="60" height="34" rx="4" fill="#ffffff" stroke="#828282" stroke-width="1.5"/>
  <text x="230" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#111111">origin/main</text>

  <line x1="262" y1="83" x2="350" y2="83" stroke="#2a7ae2" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="306" y="74" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#2a7ae2">merge</text>

  <rect x="350" y="66" width="60" height="34" rx="4" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="380" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#111111">main</text>

  <text x="230" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">git fetch si ferma qui →</text>
  <text x="230" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">git pull = fetch + merge, arriva fino in fondo</text>

  <rect x="40" y="170" width="380" height="70" rx="6" fill="#1e1e1e"/>
  <text x="56" y="196" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#f66a0a">$ git fetch origin</text>
  <text x="56" y="220" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#ffffff">$ git pull origin main</text>
</svg>
