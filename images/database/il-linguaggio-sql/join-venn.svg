<svg viewBox="0 0 460 270" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="clipA">
      <circle cx="85" cy="120" r="55"/>
    </clipPath>
  </defs>

  <text x="230" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">INNER JOIN vs LEFT JOIN</text>

  <!-- INNER JOIN -->
  <g>
    <text x="115" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">INNER JOIN</text>
    <circle cx="85" cy="120" r="55" fill="white" stroke="#828282" stroke-width="1.5"/>
    <circle cx="145" cy="120" r="55" fill="white" stroke="#828282" stroke-width="1.5"/>
    <g clip-path="url(#clipA)">
      <circle cx="145" cy="120" r="55" fill="#2a7ae2" fill-opacity="0.85"/>
    </g>
    <circle cx="85" cy="120" r="55" fill="none" stroke="#828282" stroke-width="1.5"/>
    <circle cx="145" cy="120" r="55" fill="none" stroke="#828282" stroke-width="1.5"/>
    <text x="55" y="124" text-anchor="middle" font-size="12" fill="#111111">Clienti</text>
    <text x="178" y="124" text-anchor="middle" font-size="12" fill="#111111">Ordini</text>
    <text x="115" y="195" text-anchor="middle" font-size="11" fill="#828282">solo le righe con</text>
    <text x="115" y="209" text-anchor="middle" font-size="11" fill="#828282">corrispondenza in</text>
    <text x="115" y="223" text-anchor="middle" font-size="11" fill="#828282">entrambe le tabelle</text>
  </g>

  <!-- LEFT JOIN -->
  <g transform="translate(230,0)">
    <text x="115" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">LEFT JOIN</text>
    <circle cx="85" cy="120" r="55" fill="#2a7ae2" fill-opacity="0.85" stroke="#828282" stroke-width="1.5"/>
    <circle cx="145" cy="120" r="55" fill="none" stroke="#828282" stroke-width="1.5"/>
    <text x="55" y="124" text-anchor="middle" font-size="12" fill="white">Clienti</text>
    <text x="178" y="124" text-anchor="middle" font-size="12" fill="#111111">Ordini</text>
    <text x="115" y="195" text-anchor="middle" font-size="11" fill="#828282">tutte le righe di Clienti,</text>
    <text x="115" y="209" text-anchor="middle" font-size="11" fill="#828282">anche senza corrispondenza</text>
    <text x="115" y="223" text-anchor="middle" font-size="11" fill="#828282">in Ordini (NULL)</text>
  </g>

  <line x1="230" y1="35" x2="230" y2="235" stroke="#e5e5e5" stroke-width="1"/>
</svg>
