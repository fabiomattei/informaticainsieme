<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#828282"/>
    </marker>
  </defs>

  <text x="230" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">GROUP BY e HAVING</text>

  <!-- raw rows -->
  <text x="230" y="42" text-anchor="middle" font-size="11" fill="#828282">righe della tabella film</text>
  <g font-size="10" font-weight="bold" fill="white" text-anchor="middle">
    <rect x="121" y="50" width="26" height="26" rx="3" fill="#2a7ae2"/>
    <text x="134" y="67">IT</text>
    <rect x="153" y="50" width="26" height="26" rx="3" fill="#f66a0a"/>
    <text x="166" y="67">USA</text>
    <rect x="185" y="50" width="26" height="26" rx="3" fill="#2a7ae2"/>
    <text x="198" y="67">IT</text>
    <rect x="217" y="50" width="26" height="26" rx="3" fill="#2eb872"/>
    <text x="230" y="67">MX</text>
    <rect x="249" y="50" width="26" height="26" rx="3" fill="#2a7ae2"/>
    <text x="262" y="67">IT</text>
    <rect x="281" y="50" width="26" height="26" rx="3" fill="#f66a0a"/>
    <text x="294" y="67">USA</text>
    <rect x="313" y="50" width="26" height="26" rx="3" fill="#2a7ae2"/>
    <text x="326" y="67">IT</text>
  </g>

  <!-- arrow to groups -->
  <line x1="230" y1="86" x2="230" y2="116" stroke="#828282" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="245" y="104" font-size="11" fill="#828282">GROUP BY Nazionalità</text>

  <!-- grouped boxes -->
  <rect x="45" y="122" width="110" height="60" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="100" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Italiana</text>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#2a7ae2">COUNT = 4</text>

  <rect x="175" y="122" width="110" height="60" rx="6" fill="#fdf0e6" stroke="#f66a0a" stroke-width="2"/>
  <text x="230" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">USA</text>
  <text x="230" y="164" text-anchor="middle" font-size="11" fill="#f66a0a">COUNT = 2</text>

  <rect x="305" y="122" width="110" height="60" rx="6" fill="#e8f7f0" stroke="#2eb872" stroke-width="2"/>
  <text x="360" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Messico</text>
  <text x="360" y="164" text-anchor="middle" font-size="11" fill="#2eb872">COUNT = 1</text>

  <!-- arrow to having -->
  <line x1="230" y1="192" x2="230" y2="222" stroke="#828282" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="245" y="210" font-size="11" fill="#828282">HAVING COUNT(*) &gt; 2</text>

  <!-- result -->
  <rect x="45" y="228" width="110" height="58" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="100" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Italiana</text>
  <text x="100" y="270" text-anchor="middle" font-size="11" fill="#2a7ae2">COUNT = 4</text>
  <circle cx="147" cy="235" r="8" fill="#2eb872"/>
  <path d="M143,235 l3,4 l6,-7" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <g opacity="0.4">
    <rect x="175" y="228" width="110" height="58" rx="6" fill="#fdf0e6" stroke="#f66a0a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="230" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">USA</text>
    <text x="230" y="270" text-anchor="middle" font-size="11" fill="#f66a0a">COUNT = 2</text>
  </g>
  <path d="M277,235 l10,10 M287,235 l-10,10" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>

  <g opacity="0.4">
    <rect x="305" y="228" width="110" height="58" rx="6" fill="#e8f7f0" stroke="#2eb872" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="360" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Messico</text>
    <text x="360" y="270" text-anchor="middle" font-size="11" fill="#2eb872">COUNT = 1</text>
  </g>
  <path d="M407,235 l10,10 M417,235 l-10,10" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>

  <text x="230" y="308" text-anchor="middle" font-size="12" fill="#828282">WHERE filtra le righe prima del raggruppamento, HAVING filtra i gruppi dopo</text>
</svg>
