  <text x="268" y="99" font-size="10" fill="#828282">Prof. Rossi</text>
  <text x="368" y="99" font-size="10" fill="#828282">8</text>
  <text x="28" y="121" font-size="10" fill="#828282">10</text>
  <text x="138" y="121" font-size="10" fill="#828282">Matematica</text>
  <text x="268" y="121" font-size="10" fill="#828282">Prof. Rossi</text>
  <text x="368" y="121" font-size="10" fill="#828282">6</text>
