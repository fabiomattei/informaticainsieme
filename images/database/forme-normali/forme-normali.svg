  <!-- linking key arrow between IdMateria columns -->
  <path d="M75,338 Q75,368 330,368 Q330,368 330,338" fill="none" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="384" text-anchor="middle" font-size="11" fill="#f66a0a">chiave esterna: IdMateria</text>

  <text x="240" y="408" text-anchor="middle" font-size="11" fill="#828282">niente più ripetizioni, niente più anomalie</text>
