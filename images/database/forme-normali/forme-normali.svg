    <line x1="270" y1="280" x2="460" y2="280" stroke="#2a7ae2" stroke-width="1.5"/>
    <line x1="270" y1="302" x2="460" y2="302" stroke="#2a7ae2" stroke-width="1"/>
    <line x1="330" y1="258" x2="330" y2="338" stroke="#2a7ae2" stroke-width="1"/>
