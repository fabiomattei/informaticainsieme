<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#828282"/>
    </marker>
  </defs>

  <text x="240" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Due architetture diverse</text>

  <line x1="240" y1="34" x2="240" y2="270" stroke="#e5e5e5" stroke-width="1"/>

  <!-- SQLite side -->
  <text x="130" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a7ae2">SQLite (embedded)</text>

  <rect x="35" y="58" width="190" height="50" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="130" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">la tua applicazione</text>
  <text x="130" y="95" text-anchor="middle" font-size="9" fill="#828282">include la libreria SQLite</text>

  <line x1="130" y1="108" x2="130" y2="136" stroke="#2a7ae2" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <text x="150" y="126" font-size="9" fill="#828282">legge / scrive</text>

  <rect x="55" y="140" width="150" height="40" rx="6" fill="white" stroke="#2a7ae2" stroke-width="2"/>
  <text x="130" y="164" text-anchor="middle" font-size="11" fill="#111111">dati.db (file locale)</text>

  <text x="130" y="205" text-anchor="middle" font-size="10" fill="#828282">un solo processo,</text>
  <text x="130" y="219" text-anchor="middle" font-size="10" fill="#828282">nessuna rete</text>

  <!-- MySQL side -->
  <text x="350" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#f66a0a">MySQL (client-server)</text>

  <rect x="260" y="58" width="56" height="34" rx="5" fill="#fdf0e6" stroke="#f66a0a" stroke-width="1.5"/>
  <text x="288" y="79" text-anchor="middle" font-size="9" fill="#111111">app web</text>

  <rect x="322" y="58" width="56" height="34" rx="5" fill="#fdf0e6" stroke="#f66a0a" stroke-width="1.5"/>
  <text x="350" y="79" text-anchor="middle" font-size="9" fill="#111111">phpMyAdmin</text>

  <rect x="384" y="58" width="56" height="34" rx="5" fill="#fdf0e6" stroke="#f66a0a" stroke-width="1.5"/>
  <text x="412" y="79" text-anchor="middle" font-size="9" fill="#111111">mysql CLI</text>

  <line x1="288" y1="92" x2="330" y2="136" stroke="#f66a0a" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <line x1="350" y1="92" x2="350" y2="136" stroke="#f66a0a" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <line x1="412" y1="92" x2="370" y2="136" stroke="#f66a0a" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <text x="350" y="122" text-anchor="middle" font-size="9" fill="#828282">connessioni di rete (porta 3306)</text>

  <rect x="270" y="140" width="160" height="40" rx="6" fill="#fdf0e6" stroke="#f66a0a" stroke-width="2"/>
  <text x="350" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">server MySQL</text>
  <text x="350" y="172" text-anchor="middle" font-size="9" fill="#828282">processo mysqld</text>

  <line x1="350" y1="180" x2="350" y2="196" stroke="#f66a0a" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <rect x="280" y="200" width="140" height="30" rx="6" fill="white" stroke="#f66a0a" stroke-width="1.5"/>
  <text x="350" y="219" text-anchor="middle" font-size="10" fill="#111111">scuola, negozio, ...</text>

  <text x="350" y="248" text-anchor="middle" font-size="10" fill="#828282">un processo condiviso,</text>
  <text x="350" y="262" text-anchor="middle" font-size="10" fill="#828282">tanti client in rete</text>

  <text x="240" y="292" text-anchor="middle" font-size="11" fill="#111111">SQLite: un file, un'applicazione. MySQL: un server, tanti client.</text>
</svg>
