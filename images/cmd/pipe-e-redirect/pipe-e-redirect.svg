<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f66a0a"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Pipe e redirect</text>

  <!-- pipe section -->
  <text x="30" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">pipe |</text>
  <rect x="30" y="65" width="120" height="44" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="90" y="92" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#111111">tasklist</text>

  <line x1="150" y1="87" x2="205" y2="87" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="177" y="78" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#2a7ae2">|</text>

  <rect x="210" y="65" width="120" height="44" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="270" y="92" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#111111">find "chrome"</text>

  <line x1="330" y1="87" x2="380" y2="87" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="65" width="100" height="44" rx="6" fill="#ffffff" stroke="#828282" stroke-width="2"/>
  <text x="390" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">schermo</text>

  <text x="240" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">l'output di un comando diventa l'input del successivo</text>

  <!-- redirect section -->
  <line x1="0" y1="160" x2="480" y2="160" stroke="#eef2f7" stroke-width="2"/>
  <text x="30" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">redirect &gt;</text>

  <rect x="30" y="198" width="140" height="44" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="100" y="225" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#111111">dir</text>

  <line x1="170" y1="220" x2="230" y2="220" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="200" y="210" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#f66a0a">&gt;</text>

  <rect x="235" y="198" width="150" height="44" rx="6" fill="#ffffff" stroke="#f66a0a" stroke-width="2"/>
  <text x="310" y="225" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#111111">elenco.txt</text>

  <text x="240" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">&gt; sovrascrive · &gt;&gt; accoda · &lt; legge da file</text>

  <!-- terminal recap -->
  <rect x="30" y="290" width="420" height="70" rx="6" fill="#1e1e1e"/>
  <text x="48" y="317" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#f66a0a">C:\&gt; dir cartella_inesistente 2&gt; errori.txt</text>
  <text x="48" y="342" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#f66a0a">C:\&gt; dir &gt; tutto.txt 2&gt;&amp;1</text>
</svg>
