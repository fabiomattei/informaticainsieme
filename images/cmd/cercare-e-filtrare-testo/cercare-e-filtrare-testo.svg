<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Cercare testo in un file</text>

  <!-- terminal / file box -->
  <rect x="30" y="50" width="420" height="180" rx="6" fill="#1e1e1e"/>
  <circle cx="48" cy="65" r="4" fill="#828282"/>
  <circle cx="62" cy="65" r="4" fill="#828282"/>
  <circle cx="76" cy="65" r="4" fill="#828282"/>
  <text x="48" y="90" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#828282">appunti.txt</text>

  <text x="48" y="112" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ffffff">Riga 1: tutto ok</text>
  <text x="48" y="134" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ffffff">Riga 2: errore di rete</text>
  <rect x="40" y="120" width="220" height="20" rx="4" fill="none" stroke="#f66a0a" stroke-width="2"/>
  <text x="48" y="156" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ffffff">Riga 3: connessione ok</text>
  <text x="48" y="178" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ffffff">Riga 4: errore critico</text>
  <rect x="40" y="164" width="220" height="20" rx="4" fill="none" stroke="#f66a0a" stroke-width="2"/>

  <text x="48" y="205" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#f66a0a">&gt; findstr /n "errore" appunti.txt</text>

  <!-- magnifying glass -->
  <circle cx="360" cy="145" r="42" fill="none" stroke="#2a7ae2" stroke-width="4"/>
  <line x1="390" y1="176" x2="420" y2="206" stroke="#2a7ae2" stroke-width="6" stroke-linecap="round"/>
  <text x="360" y="151" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#2a7ae2" font-weight="600">find</text>

  <rect x="80" y="250" width="320" height="60" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111">find · findstr · sort · more · where</text>
  <text x="240" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">spesso usati insieme alla pipe |</text>
</svg>
