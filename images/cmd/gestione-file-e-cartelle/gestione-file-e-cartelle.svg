<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>
  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Albero di file e cartelle</text>

  <!-- root folder -->
  <rect x="170" y="50" width="140" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111">progetti (mkdir)</text>

  <line x1="240" y1="84" x2="110" y2="120" stroke="#828282" stroke-width="2"/>
  <line x1="240" y1="84" x2="240" y2="120" stroke="#828282" stroke-width="2"/>
  <line x1="240" y1="84" x2="370" y2="120" stroke="#828282" stroke-width="2"/>

  <rect x="50" y="120" width="120" height="34" rx="6" fill="#ffffff" stroke="#2a7ae2" stroke-width="2"/>
  <text x="110" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">appunti.txt</text>

  <rect x="180" y="120" width="120" height="34" rx="6" fill="#ffffff" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">note.txt</text>

  <rect x="310" y="120" width="120" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="370" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">sottocartella</text>

  <!-- operations -->
  <line x1="110" y1="154" x2="110" y2="190" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="192" width="160" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="110" y="214" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#111111">copy / move</text>

  <line x1="240" y1="154" x2="240" y2="190" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="195" y="192" width="90" height="34" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="240" y="214" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#111111">del</text>

  <line x1="370" y1="154" x2="370" y2="190" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="192" width="140" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="370" y="214" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#111111">xcopy /robocopy</text>

  <!-- terminal at bottom -->
  <rect x="30" y="250" width="420" height="130" rx="6" fill="#1e1e1e"/>
  <circle cx="48" cy="265" r="4" fill="#828282"/>
  <circle cx="62" cy="265" r="4" fill="#828282"/>
  <circle cx="76" cy="265" r="4" fill="#828282"/>
  <text x="48" y="295" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#f66a0a">C:\&gt; ren appunti.txt note.txt</text>
  <text x="48" y="320" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#f66a0a">C:\&gt; copy appunti.txt D:\backup\</text>
  <text x="48" y="345" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#f66a0a">C:\&gt; del *.tmp</text>
  <text x="48" y="368" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#f66a0a">C:\&gt; rmdir /s /q progetti</text>
</svg>
