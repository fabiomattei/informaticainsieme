<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>
  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Una variabile di ambiente</text>

  <!-- variable box -->
  <rect x="120" y="55" width="240" height="70" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="82" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#111111" font-weight="600">%NOME%</text>
  <line x1="150" y1="95" x2="330" y2="95" stroke="#828282" stroke-width="1"/>
  <text x="240" y="113" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#f66a0a">Fabio</text>

  <text x="80" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">nome</text>
  <text x="80" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">valore</text>

  <!-- radiating access to programs -->
  <line x1="200" y1="125" x2="120" y2="190" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="125" x2="240" y2="190" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="125" x2="360" y2="190" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="195" width="120" height="36" rx="6" fill="#ffffff" stroke="#828282" stroke-width="2"/>
  <text x="120" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">script .bat</text>

  <rect x="180" y="195" width="120" height="36" rx="6" fill="#ffffff" stroke="#828282" stroke-width="2"/>
  <text x="240" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Prompt</text>

  <rect x="300" y="195" width="120" height="36" rx="6" fill="#ffffff" stroke="#828282" stroke-width="2"/>
  <text x="360" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">programmi</text>

  <text x="240" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">accessibile da qualsiasi programma o script</text>

  <rect x="60" y="278" width="360" height="44" rx="6" fill="#1e1e1e"/>
  <text x="76" y="304" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ffffff">set NOME=Fabio    echo %NOME%</text>
</svg>
