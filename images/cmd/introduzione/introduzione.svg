<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>
  <text x="240" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Struttura di un comando</text>

  <!-- terminal window -->
  <rect x="30" y="50" width="420" height="110" rx="6" fill="#1e1e1e"/>
  <circle cx="48" cy="65" r="4" fill="#828282"/>
  <circle cx="62" cy="65" r="4" fill="#828282"/>
  <circle cx="76" cy="65" r="4" fill="#828282"/>
  <text x="48" y="95" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#f66a0a">C:\Users\Utente&gt;</text>
  <text x="48" y="125" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#ffffff">dir /w</text>

  <!-- callouts -->
  <line x1="70" y1="130" x2="70" y2="200" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="205" width="110" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="85" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111">comando</text>

  <line x1="105" y1="130" x2="180" y2="200" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="160" y="205" width="110" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="215" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111">parametro</text>

  <line x1="122" y1="130" x2="360" y2="200" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="205" width="120" height="40" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="360" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111">/opzione</text>

  <text x="240" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">Il prompt mostra sempre la cartella corrente</text>

  <rect x="80" y="305" width="320" height="40" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="330" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#111111">help  /?  cls</text>
  <text x="240" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">aiuto integrato per ogni comando</text>
</svg>
