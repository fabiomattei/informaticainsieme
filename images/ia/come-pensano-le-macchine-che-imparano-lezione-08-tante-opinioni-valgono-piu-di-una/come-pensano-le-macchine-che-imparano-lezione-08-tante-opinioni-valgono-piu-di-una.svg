<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l8-title l8-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="l8-title">Molti piccoli alberi che votano insieme una decisione finale</title>
  <desc id="l8-desc">Cinque piccoli alberi decisionali affiancati, ciascuno con la propria freccia verso una casella di voto, che convergono in una casella finale con la decisione a maggioranza.</desc>

  <g stroke="#828282" stroke-width="1.5" fill="none">
    <path d="M 50,40 L 30,70 M 50,40 L 70,70" /><path d="M 130,40 L 110,70 M 130,40 L 150,70" />
    <path d="M 210,40 L 190,70 M 210,40 L 230,70" /><path d="M 290,40 L 270,70 M 290,40 L 310,70" />
    <path d="M 370,40 L 350,70 M 370,40 L 390,70" />
  </g>
  <g fill="#2a7ae2"><circle cx="50" cy="35" r="6" /><circle cx="130" cy="35" r="6" /><circle cx="210" cy="35" r="6" /><circle cx="290" cy="35" r="6" /><circle cx="370" cy="35" r="6" /></g>

  <g font-size="11" fill="#3aa655" text-anchor="middle" font-weight="bold">
    <text x="50" y="90">sì</text><text x="210" y="90">sì</text><text x="370" y="90">sì</text>
  </g>
  <g font-size="11" fill="#c85506" text-anchor="middle" font-weight="bold">
    <text x="130" y="90">no</text><text x="290" y="90">sì</text>
  </g>

  <g stroke="#828282" stroke-width="1.5">
    <line x1="50" y1="95" x2="230" y2="150" /><line x1="130" y1="95" x2="230" y2="150" /><line x1="210" y1="95" x2="230" y2="150" />
    <line x1="290" y1="95" x2="230" y2="150" /><line x1="370" y1="95" x2="230" y2="150" />
  </g>

  <rect x="170" y="150" width="120" height="50" rx="8" fill="#fde8d6" stroke="#f66a0a" stroke-width="1.5" />
  <text x="230" y="172" fill="#111" font-size="11" text-anchor="middle">voto: 4 sì, 1 no</text>
  <text x="230" y="190" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">decisione: sì</text>

  <text x="240" y="235" fill="#828282" font-size="12" text-anchor="middle">ogni albero, da solo, imperfetto; insieme, più affidabili</text>
</svg>
