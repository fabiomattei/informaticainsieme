<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thread-title thread-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="thread-title">Il filo della memoria</title>
  <desc id="thread-desc">Un filo passa attraverso quattro perline, ciascuna rappresenta lo stato della memoria in un passo della sequenza. Ogni perlina riceve dal basso un nuovo elemento della sequenza e porta il filo, ormai aggiornato, alla perlina successiva.</desc>

  <defs>
    <marker id="arrowThr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2a7ae2" />
    </marker>
    <marker id="arrowThrG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#828282" />
    </marker>
  </defs>

  <text x="240" y="26" fill="#111111" font-size="16" font-weight="bold" text-anchor="middle">Il filo della memoria</text>

  <!-- the thread: a continuous wavy line running through the beads -->
  <path d="M 20,150 Q 80,130 100,150 T 220,150 T 340,150 T 460,150"
        fill="none" stroke="#2a7ae2" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round" />
  <path d="M 20,150 L 40,150" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrowThr)" />
  <path d="M 460,150 L 470,150" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrowThr)" />

  <!-- four beads (state) -->
  <circle cx="100" cy="150" r="28" fill="#dceafc" stroke="#2a7ae2" stroke-width="2.5" />
  <circle cx="220" cy="150" r="28" fill="#dceafc" stroke="#2a7ae2" stroke-width="2.5" />
  <circle cx="340" cy="150" r="28" fill="#dceafc" stroke="#2a7ae2" stroke-width="2.5" />
  <circle cx="440" cy="150" r="28" fill="#fde8d6" stroke="#f66a0a" stroke-width="2.5" />

  <g fill="#111111" font-size="11" text-anchor="middle">
    <text x="100" y="154">stato</text><text x="220" y="154">stato</text><text x="340" y="154">stato</text><text x="440" y="154">stato</text>
  </g>

  <!-- inputs feeding up into each bead -->
  <g stroke="#828282" stroke-width="2">
    <path d="M 100,255 L 100,182" marker-end="url(#arrowThrG)" fill="none" />
    <path d="M 220,255 L 220,182" marker-end="url(#arrowThrG)" fill="none" />
    <path d="M 340,255 L 340,182" marker-end="url(#arrowThrG)" fill="none" />
    <path d="M 440,255 L 440,182" marker-end="url(#arrowThrG)" fill="none" />
  </g>
  <g fill="#eef2f7" stroke="#828282" stroke-width="1.5">
    <rect x="68" y="258" width="64" height="34" rx="6" />
    <rect x="188" y="258" width="64" height="34" rx="6" />
    <rect x="308" y="258" width="64" height="34" rx="6" />
    <rect x="408" y="258" width="64" height="34" rx="6" />
  </g>
  <g fill="#111111" font-size="11" text-anchor="middle">
    <text x="100" y="279">x1</text><text x="220" y="279">x2</text><text x="340" y="279">x3</text><text x="440" y="279">x4</text>
  </g>

  <text x="240" y="330" fill="#828282" font-size="12" text-anchor="middle">lo stesso filo porta avanti ciò che è stato letto finora</text>
  <text x="440" y="118" fill="#c85506" font-size="10" text-anchor="middle">output</text>
</svg>
