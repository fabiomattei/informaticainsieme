<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-title stack-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="stack-title">Impilare le decisioni: una rete a più piani</title>
  <desc id="stack-desc">Due ingressi si collegano a un primo strato nascosto di tre neuroni, che si collega a un secondo strato nascosto di tre neuroni, che infine converge su un unico neurone di output. Il segnale scorre da sinistra a destra.</desc>

  <defs>
    <marker id="arrowStk" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#828282" />
    </marker>
  </defs>

  <text x="240" y="24" fill="#111111" font-size="16" font-weight="bold" text-anchor="middle">Impilare le decisioni</text>

  <!-- connecting lines: input -> hidden1 -->
  <g stroke="#c9c9c9" stroke-width="1.4">
    <line x1="65" y1="120" x2="180" y2="70" /><line x1="65" y1="120" x2="180" y2="190" /><line x1="65" y1="120" x2="180" y2="310" />
    <line x1="65" y1="270" x2="180" y2="70" /><line x1="65" y1="270" x2="180" y2="190" /><line x1="65" y1="270" x2="180" y2="310" />
  </g>
  <!-- hidden1 -> hidden2 -->
  <g stroke="#c9c9c9" stroke-width="1.4">
    <line x1="200" y1="70" x2="300" y2="70" /><line x1="200" y1="70" x2="300" y2="190" /><line x1="200" y1="70" x2="300" y2="310" />
    <line x1="200" y1="190" x2="300" y2="70" /><line x1="200" y1="190" x2="300" y2="190" /><line x1="200" y1="190" x2="300" y2="310" />
    <line x1="200" y1="310" x2="300" y2="70" /><line x1="200" y1="310" x2="300" y2="190" /><line x1="200" y1="310" x2="300" y2="310" />
  </g>
  <!-- hidden2 -> output -->
  <g stroke="#c9c9c9" stroke-width="1.4">
    <line x1="320" y1="70" x2="420" y2="190" /><line x1="320" y1="190" x2="420" y2="190" /><line x1="320" y1="310" x2="420" y2="190" />
  </g>

  <!-- input nodes -->
  <circle cx="65" cy="120" r="20" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2" />
  <circle cx="65" cy="270" r="20" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2" />

  <!-- hidden layer 1 -->
  <circle cx="190" cy="70" r="20" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
  <circle cx="190" cy="190" r="20" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
  <circle cx="190" cy="310" r="20" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />

  <!-- hidden layer 2 -->
  <circle cx="310" cy="70" r="20" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
  <circle cx="310" cy="190" r="20" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
  <circle cx="310" cy="310" r="20" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />

  <!-- output node -->
  <circle cx="420" cy="190" r="24" fill="#fde8d6" stroke="#f66a0a" stroke-width="2" />

  <path d="M 452,190 L 470,190" fill="none" stroke="#828282" stroke-width="2" marker-end="url(#arrowStk)" />

  <text x="65" y="355" fill="#828282" font-size="11" text-anchor="middle">input</text>
  <text x="250" y="355" fill="#828282" font-size="11" text-anchor="middle">strati nascosti</text>
  <text x="420" y="355" fill="#828282" font-size="11" text-anchor="middle">output</text>

  <text x="240" y="385" fill="#828282" font-size="12" text-anchor="middle">ogni piano combina ciò che ha capito il piano precedente</text>
</svg>
