<svg viewBox="0 0 480 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pref-title pref-desc">
  <title id="pref-title">La mappa del percorso del libro</title>
  <desc id="pref-desc">Un sentiero a zig-zag con sette pietre numerate, dalla Prefazione alla Lezione 6, ciascuna con una breve etichetta del tema, e una freccia finale che indica il proseguimento verso le lezioni successive.</desc>
  <defs>
    <marker id="prefArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#828282" />
    </marker>
  </defs>

  <text x="240" y="26" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Il percorso del libro</text>

  <!-- sentiero -->
  <path d="M 55,60 C 55,90 150,90 150,120 C 150,150 60,150 60,180 C 60,210 250,210 250,150 C 250,110 370,110 380,150 C 388,180 300,190 300,220 C 300,250 130,250 130,280 C 130,310 250,310 260,340 C 268,364 340,364 400,370"
        fill="none" stroke="#828282" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" />

  <!-- pietre -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- 0 Prefazione -->
    <circle cx="55" cy="60" r="20" fill="#f66a0a" stroke="#c85506" stroke-width="2" />
    <text x="55" y="65" fill="#fdfdfd" font-size="13" font-weight="bold" text-anchor="middle">0</text>
    <text x="82" y="52" fill="#111111" font-size="11" font-weight="bold" text-anchor="start">Prefazione</text>
    <text x="82" y="66" fill="#828282" font-size="10" text-anchor="start">di cosa parla il libro</text>

    <!-- 1 -->
    <circle cx="150" cy="120" r="20" fill="#2a7ae2" stroke="#1d5eb8" stroke-width="2" />
    <text x="150" y="125" fill="#fdfdfd" font-size="13" font-weight="bold" text-anchor="middle">1</text>
    <text x="177" y="112" fill="#111111" font-size="11" font-weight="bold" text-anchor="start">Indovina la parola</text>
    <text x="177" y="126" fill="#828282" font-size="10" text-anchor="start">da bigrammi a Transformer</text>

    <!-- 2 -->
    <circle cx="60" cy="180" r="20" fill="#2a7ae2" stroke="#1d5eb8" stroke-width="2" />
    <text x="60" y="185" fill="#fdfdfd" font-size="13" font-weight="bold" text-anchor="middle">2</text>
    <text x="87" y="172" fill="#111111" font-size="11" font-weight="bold" text-anchor="start">Leggere le parole</text>
    <text x="87" y="186" fill="#828282" font-size="10" text-anchor="start">token e mappa dei significati</text>

    <!-- 3 -->
    <circle cx="250" cy="150" r="20" fill="#2a7ae2" stroke="#1d5eb8" stroke-width="2" />
    <text x="250" y="155" fill="#fdfdfd" font-size="13" font-weight="bold" text-anchor="middle">3</text>
    <text x="250" y="128" fill="#111111" font-size="11" font-weight="bold" text-anchor="middle">L'attenzione</text>
    <text x="250" y="185" fill="#828282" font-size="10" text-anchor="middle">a chi guarda ogni parola</text>

    <!-- 4 -->
    <circle cx="380" cy="150" r="20" fill="#2a7ae2" stroke="#1d5eb8" stroke-width="2" />
    <text x="380" y="155" fill="#fdfdfd" font-size="13" font-weight="bold" text-anchor="middle">4</text>
    <text x="380" y="128" fill="#111111" font-size="11" font-weight="bold" text-anchor="middle">Allenare un gigante</text>
    <text x="380" y="185" fill="#828282" font-size="10" text-anchor="middle">pre-training e scala</text>

    <!-- 5 -->
    <circle cx="130" cy="280" r="20" fill="#2a7ae2" stroke="#1d5eb8" stroke-width="2" />
    <text x="130" y="285" fill="#fdfdfd" font-size="13" font-weight="bold" text-anchor="middle">5</text>
    <text x="157" y="272" fill="#111111" font-size="11" font-weight="bold" text-anchor="start">Buone maniere</text>
    <text x="157" y="286" fill="#828282" font-size="10" text-anchor="start">post-training e RLHF</text>

    <!-- 6 -->
    <circle cx="260" cy="340" r="20" fill="#2a7ae2" stroke="#1d5eb8" stroke-width="2" />
    <text x="260" y="345" fill="#fdfdfd" font-size="13" font-weight="bold" text-anchor="middle">6</text>
    <text x="260" y="318" fill="#111111" font-size="11" font-weight="bold" text-anchor="middle">Nasce una risposta</text>
    <text x="260" y="374" fill="#828282" font-size="10" text-anchor="middle">generazione parola per parola</text>
  </g>

  <!-- prosegue -->
  <path d="M 404,372 L 440,378" fill="none" stroke="#828282" stroke-width="2" marker-end="url(#prefArrow)" />
  <text x="445" y="400" fill="#828282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">e altre lezioni...</text>

  <text x="240" y="425" fill="#828282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">un passo alla volta, senza formule</text>
</svg>
