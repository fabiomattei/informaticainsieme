<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>
  <text x="230" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" font-weight="600">Condensare senza perdere il senso</text>

  <!-- long doc -->
  <rect x="20" y="46" width="140" height="230" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <g stroke="#828282" stroke-width="2">
    <line x1="34" y1="66" x2="146" y2="66"/>
    <line x1="34" y1="86" x2="146" y2="86"/>
    <line x1="34" y1="106" x2="146" y2="106"/>
    <line x1="34" y1="126" x2="146" y2="126"/>
    <line x1="34" y1="146" x2="120" y2="146"/>
    <line x1="34" y1="166" x2="146" y2="166"/>
    <line x1="34" y1="186" x2="146" y2="186"/>
    <line x1="34" y1="206" x2="146" y2="206"/>
    <line x1="34" y1="226" x2="130" y2="226"/>
    <line x1="34" y1="246" x2="146" y2="246"/>
  </g>
  <text x="90" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Testo originale</text>

  <!-- funnel -->
  <polygon points="180,90 290,120 290,200 180,232" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="235" y="164" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#111111" font-weight="600">sintesi</text>
  <line x1="290" y1="160" x2="320" y2="160" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- short summary -->
  <rect x="325" y="120" width="115" height="80" rx="6" fill="#fdf1e7" stroke="#f66a0a" stroke-width="2"/>
  <g stroke="#828282" stroke-width="2">
    <line x1="338" y1="140" x2="428" y2="140"/>
    <line x1="338" y1="160" x2="428" y2="160"/>
    <line x1="338" y1="180" x2="400" y2="180"/>
  </g>
  <text x="382" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Riassunto</text>

  <text x="235" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282">estrattivo o astrattivo</text>
</svg>
