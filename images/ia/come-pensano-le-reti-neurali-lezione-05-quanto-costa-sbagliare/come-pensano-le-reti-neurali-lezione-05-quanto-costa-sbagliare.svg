<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Quanto costa sbagliare</text>

  <!-- legend -->
  <circle cx="150" cy="48" r="6" fill="#2a7ae2"/>
  <text x="162" y="52" font-size="12" fill="#828282">valore reale</text>
  <circle cx="280" cy="48" r="6" fill="#f66a0a"/>
  <text x="292" y="52" font-size="12" fill="#828282">predizione</text>

  <!-- Row A: small error -->
  <line x1="140" y1="90" x2="200" y2="90" stroke="#828282" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="140" cy="90" r="9" fill="#2a7ae2"/>
  <circle cx="200" cy="90" r="9" fill="#f66a0a"/>
  <text x="170" y="76" text-anchor="middle" font-size="12" fill="#111111">errore piccolo</text>

  <line x1="170" y1="102" x2="170" y2="148" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="125" y="153" width="90" height="42" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="170" y="171" text-anchor="middle" font-size="11" fill="#828282">loss</text>
  <text x="170" y="188" text-anchor="middle" font-size="14" fill="#111111">bassa</text>

  <!-- Row B: large error -->
  <line x1="140" y1="245" x2="380" y2="245" stroke="#828282" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="140" cy="245" r="9" fill="#2a7ae2"/>
  <circle cx="380" cy="245" r="9" fill="#f66a0a"/>
  <text x="260" y="231" text-anchor="middle" font-size="12" fill="#111111">errore grande</text>

  <line x1="260" y1="257" x2="260" y2="303" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="215" y="308" width="90" height="46" rx="6" fill="#fde8d6" stroke="#f66a0a" stroke-width="2"/>
  <text x="260" y="327" text-anchor="middle" font-size="11" fill="#828282">loss</text>
  <text x="260" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">alta</text>

  <text x="240" y="380" text-anchor="middle" font-size="13" fill="#828282">più la predizione si allontana dalla realtà,</text>
  <text x="240" y="396" text-anchor="middle" font-size="13" fill="#828282">più cresce la funzione di perdita</text>
</svg>
