<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#828282"/>
    </marker>
  </defs>
  <text x="240" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" font-weight="600">La gerarchia della governance AI</text>

  <!-- side arrow -->
  <line x1="30" y1="330" x2="30" y2="60" stroke="#828282" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="18" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#828282" transform="rotate(-90 18 200)">verificabilità crescente</text>

  <!-- tier 1 base -->
  <rect x="60" y="290" width="380" height="54" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="250" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111" font-weight="600">Principi dichiarati dall'organizzazione</text>

  <!-- tier 2 -->
  <rect x="100" y="228" width="300" height="54" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="250" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111" font-weight="600">Standard interni (Google, OpenAI...)</text>

  <!-- tier 3 -->
  <rect x="140" y="166" width="220" height="54" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="250" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" font-weight="600">Framework di rischio (NIST)</text>

  <!-- tier 4 top -->
  <rect x="180" y="104" width="140" height="54" rx="6" fill="#fdf1e7" stroke="#f66a0a" stroke-width="2"/>
  <text x="250" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" font-weight="600">Standard</text>
  <text x="250" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" font-weight="600">internazionali (ISO)</text>

  <text x="250" y="378" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">Dai principi interni alla certificazione globale</text>
</svg>
