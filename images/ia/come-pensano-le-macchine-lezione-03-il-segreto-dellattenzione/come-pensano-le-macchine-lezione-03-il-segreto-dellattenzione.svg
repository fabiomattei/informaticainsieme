<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l3-title l3-desc">
  <title id="l3-title">Il meccanismo dell'attenzione</title>
  <desc id="l3-desc">La frase "Marco ha detto a Luca che gli" disposta in caselle. Dalla parola "gli" partono frecce verso le parole precedenti, con spessore proporzionale a quanto "gli" le ascolta: molto spessa verso "Luca", media verso "detto", sottile verso "Marco" e le altre. Nessuna freccia punta in avanti.</desc>
  <defs>
    <marker id="l3Arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2a7ae2" />
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="240" y="24" fill="#111111" font-size="14" font-weight="bold" text-anchor="middle">A chi presta attenzione "gli"?</text>

    <!-- frecce di attenzione, da gli (posizione 7) verso le parole precedenti -->
    <!-- gli è al centro x=380 -->
    <path d="M 380,120 Q 250,60 60,120" fill="none" stroke="#2a7ae2" stroke-width="1.5" opacity="0.35" marker-end="url(#l3Arrow)" />
    <path d="M 380,120 Q 270,70 130,120" fill="none" stroke="#2a7ae2" stroke-width="2" opacity="0.4" marker-end="url(#l3Arrow)" />
    <path d="M 380,120 Q 300,80 200,120" fill="none" stroke="#2a7ae2" stroke-width="4" opacity="0.65" marker-end="url(#l3Arrow)" />
    <path d="M 380,120 Q 320,90 270,120" fill="none" stroke="#2a7ae2" stroke-width="2.5" opacity="0.45" marker-end="url(#l3Arrow)" />
    <path d="M 380,120 Q 350,100 320,120" fill="none" stroke="#2a7ae2" stroke-width="9" opacity="0.9" marker-end="url(#l3Arrow)" />

    <!-- caselle parola -->
    <g font-size="13" text-anchor="middle">
      <rect x="30" y="128" width="60" height="44" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="60" y="155" fill="#111111">Marco</text>
      <rect x="100" y="128" width="60" height="44" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="130" y="155" fill="#111111">ha</text>
      <rect x="170" y="128" width="60" height="44" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="200" y="155" fill="#111111">detto</text>
      <rect x="240" y="128" width="60" height="44" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="270" y="155" fill="#111111">a</text>
      <rect x="310" y="128" width="60" height="44" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="340" y="155" fill="#111111">Luca</text>
      <rect x="350" y="128" width="60" height="44" rx="6" fill="#fdfdfd" stroke="#828282" stroke-width="1.5" opacity="0" /><text x="0" y="0" opacity="0"> </text>
      <rect x="350" y="128" width="60" height="44" rx="6" fill="#dceafc" stroke="#2a7ae2" stroke-width="2.5" /><text x="380" y="155" fill="#1d5eb8" font-weight="bold">gli</text>
    </g>

    <!-- parola futura, bloccata -->
    <rect x="420" y="128" width="55" height="44" rx="6" fill="#f3f3f3" stroke="#828282" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="447" y="150" fill="#828282" font-size="11" text-anchor="middle">libro</text>
    <text x="447" y="164" fill="#828282" font-size="14" text-anchor="middle">🚫</text>
    <text x="447" y="186" fill="#828282" font-size="9" text-anchor="middle">futura:</text>
    <text x="447" y="197" fill="#828282" font-size="9" text-anchor="middle">bloccata</text>

    <!-- legenda spessore -->
    <text x="30" y="215" fill="#111111" font-size="12" font-weight="bold" text-anchor="start">quanto "ascolta" ciascuna parola:</text>

    <line x1="30" y1="240" x2="90" y2="240" stroke="#2a7ae2" stroke-width="9" opacity="0.9" />
    <text x="100" y="245" fill="#111111" font-size="12" text-anchor="start">molto (Luca)</text>

    <line x1="230" y1="240" x2="290" y2="240" stroke="#2a7ae2" stroke-width="4" opacity="0.65" />
    <text x="300" y="245" fill="#111111" font-size="12" text-anchor="start">abbastanza (detto)</text>

    <line x1="30" y1="270" x2="90" y2="270" stroke="#2a7ae2" stroke-width="1.5" opacity="0.35" />
    <text x="100" y="275" fill="#111111" font-size="12" text-anchor="start">poco (Marco, ha, a)</text>

    <text x="240" y="320" fill="#828282" font-size="11" text-anchor="middle">il peso dipende dal significato, non solo dalla posizione</text>
    <text x="240" y="340" fill="#828282" font-size="11" text-anchor="middle">e non può mai puntare a una parola futura</text>
  </g>
</svg>
