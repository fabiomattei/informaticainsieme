<svg viewBox="0 0 480 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l6-title l6-desc">
  <title id="l6-title">La generazione parola per parola</title>
  <desc id="l6-desc">Una catena di parole già scritte cresce una alla volta: a ogni passo il modello calcola un mazzo di probabilità, ne pesca una parola, e la riaggiunge in fondo alla catena come input per il passo successivo, in un ciclo che si ripete.</desc>
  <defs>
    <marker id="l6Arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#828282" />
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="240" y="24" fill="#111111" font-size="14" font-weight="bold" text-anchor="middle">Come nasce una risposta, un pezzo alla volta</text>

    <!-- catena di parole già generate -->
    <g font-size="12" text-anchor="middle">
      <rect x="30" y="46" width="50" height="36" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="55" y="69" fill="#111111">Il</text>
      <rect x="86" y="46" width="60" height="36" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="116" y="69" fill="#111111">gatto</text>
      <rect x="152" y="46" width="60" height="36" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="182" y="69" fill="#111111">si è</text>
      <rect x="218" y="46" width="90" height="36" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="263" y="69" fill="#111111">arrampicato</text>
      <rect x="314" y="46" width="55" height="36" rx="6" fill="#eef2f7" stroke="#828282" stroke-width="1.5" /><text x="341" y="69" fill="#111111">su un</text>
      <rect x="375" y="46" width="80" height="36" rx="6" fill="#fde8d6" stroke="#f66a0a" stroke-width="2" stroke-dasharray="3 2" /><text x="415" y="69" fill="#c85506" font-weight="bold">?</text>
    </g>
    <text x="240" y="98" fill="#828282" font-size="11" text-anchor="middle">il contesto scritto finora</text>

    <path d="M 240,110 L 240,138" stroke="#828282" stroke-width="2" fill="none" marker-end="url(#l6Arrow)" />

    <!-- ciclo -->
    <path d="M 200,158 L 260,158" fill="none" stroke="#828282" stroke-width="2" marker-end="url(#l6Arrow)" />
    <path d="M 350,198 L 350,258" fill="none" stroke="#828282" stroke-width="2" marker-end="url(#l6Arrow)" />
    <path d="M 260,298 L 200,298" fill="none" stroke="#828282" stroke-width="2" marker-end="url(#l6Arrow)" />
    <path d="M 130,258 L 130,198" fill="none" stroke="#828282" stroke-width="2" marker-end="url(#l6Arrow)" />

    <rect x="40" y="158" width="160" height="80" rx="8" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
    <text x="120" y="188" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">1. mazzo di</text>
    <text x="120" y="205" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">probabilità</text>
    <text x="120" y="222" fill="#1d5eb8" font-size="10" text-anchor="middle">albero 55%, tetto 22%...</text>

    <rect x="260" y="158" width="160" height="80" rx="8" fill="#fde8d6" stroke="#f66a0a" stroke-width="2" />
    <text x="340" y="188" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">2. pesca una</text>
    <text x="340" y="205" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">parola</text>
    <text x="340" y="222" fill="#c85506" font-size="10" text-anchor="middle">urna pesata (temperatura)</text>

    <rect x="260" y="260" width="160" height="80" rx="8" fill="#eef2f7" stroke="#828282" stroke-width="1.5" />
    <text x="340" y="290" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">3. aggiungi</text>
    <text x="340" y="307" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">al contesto</text>
    <text x="340" y="324" fill="#828282" font-size="10" text-anchor="middle">"...su un albero"</text>

    <rect x="40" y="260" width="160" height="80" rx="8" fill="#eef2f7" stroke="#828282" stroke-width="1.5" />
    <text x="120" y="290" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">4. ripeti per</text>
    <text x="120" y="307" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">la prossima</text>
    <text x="120" y="324" fill="#828282" font-size="10" text-anchor="middle">parola, da capo</text>

    <text x="240" y="368" fill="#828282" font-size="11" text-anchor="middle">nessuna frase intera è "pensata" in anticipo:</text>
    <text x="240" y="386" fill="#828282" font-size="11" text-anchor="middle">emerge un pezzo alla volta, ripetendo il ciclo</text>
  </g>
</svg>
