<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l5-title l5-desc">
  <title id="l5-title">Dal modello grezzo all'assistente allineato</title>
  <desc id="l5-desc">A sinistra un modello grezzo, uscito dal solo pre-training. Tre frecce di feedback umano (esempi curati, preferenze, correzioni) lo attraversano e lo trasformano, a destra, in un assistente allineato che risponde bene ed evita richieste pericolose.</desc>
  <defs>
    <marker id="l5Arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2a7ae2" />
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="240" y="24" fill="#111111" font-size="14" font-weight="bold" text-anchor="middle">Insegnargli le buone maniere</text>

    <!-- modello grezzo -->
    <rect x="20" y="150" width="120" height="100" rx="8" fill="#f3f3f3" stroke="#828282" stroke-width="2" />
    <text x="80" y="180" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">modello</text>
    <text x="80" y="196" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">grezzo</text>
    <text x="80" y="216" fill="#828282" font-size="10" text-anchor="middle">completa testo,</text>
    <text x="80" y="230" fill="#828282" font-size="10" text-anchor="middle">non aiuta</text>

    <!-- tre frecce di feedback -->
    <path d="M 145,170 L 195,140" stroke="#2a7ae2" stroke-width="2.5" fill="none" marker-end="url(#l5Arrow)" />
    <text x="170" y="128" fill="#1d5eb8" font-size="10" text-anchor="middle">esempi curati (SFT)</text>

    <path d="M 145,200 L 195,200" stroke="#2a7ae2" stroke-width="2.5" fill="none" marker-end="url(#l5Arrow)" />
    <text x="170" y="192" fill="#1d5eb8" font-size="10" text-anchor="middle">preferenze umane</text>

    <path d="M 145,230 L 195,260" stroke="#2a7ae2" stroke-width="2.5" fill="none" marker-end="url(#l5Arrow)" />
    <text x="170" y="278" fill="#1d5eb8" font-size="10" text-anchor="middle">premio/freno (RLHF, DPO)</text>

    <!-- imbuto di raffinamento -->
    <path d="M 200,130 L 300,150 L 300,250 L 200,270 Z" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
    <text x="250" y="203" fill="#1d5eb8" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 250 203)">post-training</text>

    <path d="M 305,200 L 335,200" stroke="#828282" stroke-width="2.5" fill="none" marker-end="url(#l5Arrow)" />

    <!-- modello allineato -->
    <rect x="340" y="150" width="120" height="100" rx="8" fill="#dceafc" stroke="#2a7ae2" stroke-width="2.5" />
    <text x="400" y="180" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">assistente</text>
    <text x="400" y="196" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">allineato</text>
    <text x="400" y="216" fill="#1d5eb8" font-size="10" text-anchor="middle">risponde, è onesto,</text>
    <text x="400" y="230" fill="#1d5eb8" font-size="10" text-anchor="middle">rifiuta con garbo ✓</text>

    <!-- esempio prima/dopo -->
    <rect x="20" y="290" width="200" height="50" rx="6" fill="#fdfdfd" stroke="#828282" stroke-width="1.5" />
    <text x="120" y="308" fill="#828282" font-size="10" text-anchor="middle" font-style="italic">"...domanda posta spesso</text>
    <text x="120" y="322" fill="#828282" font-size="10" text-anchor="middle" font-style="italic">agli esami di quinta..." ✗</text>

    <rect x="260" y="290" width="200" height="50" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5" />
    <text x="360" y="313" fill="#111111" font-size="14" font-weight="bold" text-anchor="middle">"Parigi." ✓</text>

    <text x="240" y="368" fill="#828282" font-size="11" text-anchor="middle">stesso modello di base: cambia solo come si comporta</text>
    <text x="240" y="386" fill="#828282" font-size="11" text-anchor="middle">un freno lo mantiene vicino al comportamento imparato</text>
  </g>
</svg>
