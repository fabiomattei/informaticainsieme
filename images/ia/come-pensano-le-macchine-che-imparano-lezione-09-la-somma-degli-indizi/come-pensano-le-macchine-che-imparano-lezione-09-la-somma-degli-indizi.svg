<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l9a-title l9a-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="l9a-title">Una bilancia che pende dal lato con più indizi</title>
  <desc id="l9a-desc">Una bilancia con perni al centro, un piatto a sinistra carico di indizi che pende verso il basso etichettato spam, e un piatto a destra più leggero etichettato non spam.</desc>

  <path d="M 240,60 L 240,160" stroke="#828282" stroke-width="4" />
  <path d="M 220,190 L 260,190 L 240,160 Z" fill="#828282" />

  <path d="M 90,190 L 390,110" stroke="#111" stroke-width="3" stroke-linecap="round" />
  <circle cx="240" cy="150" r="6" fill="#111" />

  <path d="M 90,190 L 90,215" stroke="#828282" stroke-width="1.5" />
  <path d="M 60,215 L 120,215 L 110,235 L 70,235 Z" fill="#fde8d6" stroke="#f66a0a" stroke-width="1.5" />

  <path d="M 390,110 L 390,135" stroke="#828282" stroke-width="1.5" />
  <path d="M 365,135 L 415,135 L 408,150 L 372,150 Z" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5" />

  <g font-size="10" fill="#111" text-anchor="middle">
    <rect x="55" y="150" width="70" height="22" rx="5" fill="#fdfdfd" stroke="#f66a0a" /><text x="90" y="165">"gratis"</text>
    <rect x="60" y="120" width="70" height="22" rx="5" fill="#fdfdfd" stroke="#f66a0a" /><text x="95" y="135">"click"</text>
    <rect x="330" y="80" width="70" height="22" rx="5" fill="#fdfdfd" stroke="#2a7ae2" /><text x="365" y="95">"fattura"</text>
  </g>

  <text x="90" y="252" fill="#c85506" font-size="12" font-weight="bold" text-anchor="middle">spam</text>
  <text x="390" y="172" fill="#2a7ae2" font-size="12" font-weight="bold" text-anchor="middle">non spam</text>
</svg>
