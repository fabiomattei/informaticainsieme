<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apA-title apA-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="apA-title">Un elenco di spunte, una per lezione risolta</title>
  <desc id="apA-desc">Otto righe con un segno di spunta ciascuna, numerate da 1 a 8, a rappresentare le soluzioni delle otto lezioni del libro.</desc>

