    <text x="60" y="35">Lezione 1</text><text x="60" y="60">Lezione 2</text><text x="60" y="85">Lezione 3</text><text x="60" y="110">Lezione 4</text>
    <text x="60" y="135">Lezione 5</text><text x="60" y="160">Lezione 6</text><text x="60" y="185">Lezione 7</text><text x="60" y="210">Lezione 8</text>
  </g>
  <g stroke="#3aa655" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 190,30 L 197,37 L 212,20" /><path d="M 190,55 L 197,62 L 212,45" />
    <path d="M 190,80 L 197,87 L 212,70" /><path d="M 190,105 L 197,112 L 212,95" />
