<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Allenarsi bene, non a memoria</text>

  <!-- axes -->
  <line x1="60" y1="270" x2="440" y2="270" stroke="#828282" stroke-width="1.5"/>
  <line x1="60" y1="270" x2="60" y2="60" stroke="#828282" stroke-width="1.5"/>
  <text x="250" y="300" text-anchor="middle" font-size="12" fill="#828282">tempo di allenamento</text>
  <text x="30" y="165" text-anchor="middle" font-size="12" fill="#828282" transform="rotate(-90 30 165)">errore</text>

  <!-- overfitting zone -->
  <rect x="270" y="60" width="170" height="210" fill="#fde8d6" opacity="0.5"/>
  <line x1="270" y1="60" x2="270" y2="270" stroke="#828282" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="355" y="52" text-anchor="middle" font-size="11" fill="#c85506">inizia l'overfitting</text>

  <!-- training curve: goes down -->
  <path d="M60,90 C130,150 220,220 440,250" fill="none" stroke="#2a7ae2" stroke-width="3"/>

  <!-- validation curve: down then up -->
  <path d="M60,110 C130,170 220,215 270,215 C330,215 390,150 440,90" fill="none" stroke="#f66a0a" stroke-width="3"/>

  <!-- legend -->
  <line x1="80" y1="330" x2="105" y2="330" stroke="#2a7ae2" stroke-width="3"/>
  <text x="112" y="334" font-size="12" fill="#111111">errore di allenamento</text>
  <line x1="280" y1="330" x2="305" y2="330" stroke="#f66a0a" stroke-width="3"/>
  <text x="312" y="334" font-size="12" fill="#111111">errore di validazione</text>
</svg>
