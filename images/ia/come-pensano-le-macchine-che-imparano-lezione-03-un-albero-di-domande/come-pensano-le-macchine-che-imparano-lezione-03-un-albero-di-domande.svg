<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l3-title l3-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="l3-title">Un piccolo albero di domande sì/no</title>
  <desc id="l3-desc">Un albero decisionale con un nodo radice che pone una domanda, due rami che portano a un altro nodo di domanda e a una foglia, e altre due foglie finali con le decisioni.</desc>

  <rect x="170" y="20" width="140" height="46" rx="8" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5" />
  <text x="240" y="48" fill="#111" font-size="12" text-anchor="middle">suono cupo?</text>

  <path d="M 200,66 L 110,120" fill="none" stroke="#828282" stroke-width="1.5" />
  <text x="140" y="95" fill="#3aa655" font-size="11">sì</text>
  <path d="M 280,66 L 370,120" fill="none" stroke="#828282" stroke-width="1.5" />
  <text x="345" y="95" fill="#c85506" font-size="11">no</text>

  <rect x="40" y="122" width="140" height="46" rx="8" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5" />
  <text x="110" y="150" fill="#111" font-size="12" text-anchor="middle">giallo intenso?</text>

  <rect x="310" y="126" width="120" height="42" rx="8" fill="#fde8d6" stroke="#f66a0a" stroke-width="1.5" />
  <text x="370" y="151" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">non matura</text>

  <path d="M 80,168 L 40,220" fill="none" stroke="#828282" stroke-width="1.5" />
  <text x="45" y="200" fill="#3aa655" font-size="11">sì</text>
  <path d="M 140,168 L 190,220" fill="none" stroke="#828282" stroke-width="1.5" />
  <text x="175" y="200" fill="#c85506" font-size="11">no</text>

  <rect x="10" y="222" width="110" height="34" rx="8" fill="#e5f4ea" stroke="#3aa655" stroke-width="1.5" />
  <text x="65" y="243" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">matura</text>

  <rect x="150" y="222" width="120" height="34" rx="8" fill="#fde8d6" stroke="#f66a0a" stroke-width="1.5" />
  <text x="210" y="243" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">non matura</text>
</svg>
