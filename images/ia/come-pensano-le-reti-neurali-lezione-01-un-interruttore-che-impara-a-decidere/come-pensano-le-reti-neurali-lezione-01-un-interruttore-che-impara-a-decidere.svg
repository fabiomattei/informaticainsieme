<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="neur-title neur-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="neur-title">Un solo neurone: pesa, somma, decide</title>
  <desc id="neur-desc">Tre ingressi, ciascuno moltiplicato per un peso, entrano in un cerchio che li somma. La somma passa per una soglia che decide se l'uscita finale è 0 oppure 1.</desc>

  <defs>
    <marker id="arrowN1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2a7ae2" />
    </marker>
    <marker id="arrowN1g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#828282" />
    </marker>
  </defs>

  <text x="240" y="26" fill="#111111" font-size="16" font-weight="bold" text-anchor="middle">Un interruttore che impara a decidere</text>

  <!-- inputs -->
  <rect x="20" y="46" width="90" height="42" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2" />
  <text x="65" y="72" fill="#111111" font-size="13" text-anchor="middle">x1</text>

  <rect x="20" y="188" width="90" height="42" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2" />
  <text x="65" y="214" fill="#111111" font-size="13" text-anchor="middle">x2</text>

  <rect x="20" y="330" width="90" height="42" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2" />
  <text x="65" y="356" fill="#111111" font-size="13" text-anchor="middle">x3</text>

  <!-- weighted arrows converging to sum circle -->
  <path d="M 112,67 L 202,192" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrowN1)" />
  <text x="140" y="120" fill="#2a7ae2" font-size="12" font-weight="bold">w1</text>

  <path d="M 112,209 L 202,209" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrowN1)" />
  <text x="140" y="200" fill="#2a7ae2" font-size="12" font-weight="bold">w2</text>

  <path d="M 112,351 L 202,226" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrowN1)" />
  <text x="140" y="308" fill="#2a7ae2" font-size="12" font-weight="bold">w3</text>

  <!-- sum circle -->
  <circle cx="235" cy="209" r="40" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2" />
  <text x="235" y="219" fill="#111111" font-size="24" text-anchor="middle">&#931;</text>

  <path d="M 275,209 L 320,209" fill="none" stroke="#828282" stroke-width="2" marker-end="url(#arrowN1g)" />

  <!-- threshold gate -->
  <rect x="324" y="176" width="100" height="66" rx="6" fill="#fde8d6" stroke="#f66a0a" stroke-width="2" />
  <text x="374" y="204" fill="#111111" font-size="12" text-anchor="middle">soglia</text>
  <text x="374" y="222" fill="#111111" font-size="13" font-weight="bold" text-anchor="middle">&gt; &#952; ?</text>

  <!-- final decision box -->
  <path d="M 374,242 L 374,270" fill="none" stroke="#828282" stroke-width="2" marker-end="url(#arrowN1g)" />
  <rect x="314" y="274" width="120" height="50" rx="8" fill="#fde8d6" stroke="#f66a0a" stroke-width="2" />
  <text x="374" y="296" fill="#111111" font-size="13" font-weight="bold" text-anchor="middle">decisione</text>
  <text x="374" y="313" fill="#c85506" font-size="13" font-weight="bold" text-anchor="middle">0 / 1</text>

  <text x="240" y="400" fill="#828282" font-size="12" text-anchor="middle">ogni peso può essere corretto dall'errore</text>
</svg>
