<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l10a-title l10a-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="l10a-title">Due gruppi di punti separati dalla strada più larga possibile</title>
  <desc id="l10a-desc">Punti di due colori separati da una fascia diagonale, con i bordi della fascia che toccano esattamente i punti più vicini di ciascun gruppo.</desc>

  <rect x="20" y="20" width="440" height="220" rx="10" fill="#fdfdfd" stroke="#e3e3e3" stroke-width="1.5" />

  <polygon points="30,220 220,30 260,30 100,230" fill="#eef2f7" opacity="0.7" />
  <path d="M 220,30 L 100,230" stroke="#828282" stroke-width="1.5" stroke-dasharray="5 4" />
  <path d="M 30,220 L 200,30" stroke="#2a7ae2" stroke-width="1.5" />
  <path d="M 260,30 L 130,230" stroke="#f66a0a" stroke-width="1.5" />

  <g fill="#c85506">
    <circle cx="70" cy="200" r="7" /><circle cx="90" cy="160" r="7" /><circle cx="60" cy="130" r="7" /><circle cx="130" cy="200" r="7" stroke="#111" stroke-width="2" />
  </g>
  <g fill="#fdfdfd" stroke="#2a7ae2" stroke-width="2">
    <circle cx="330" cy="90" r="7" /><circle cx="360" cy="130" r="7" /><circle cx="380" cy="60" r="7" /><circle cx="270" cy="60" r="7" stroke-width="3" />
  </g>

  <text x="240" y="252" fill="#828282" font-size="12" text-anchor="middle">i punti più vicini al bordo (cerchiati) fissano la larghezza della strada</text>
</svg>
