<svg viewBox="0 0 480 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prefroad-title prefroad-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="prefroad-title">Il percorso del libro</title>
  <desc id="prefroad-desc">Un sentiero a tappe che parte da un punto di partenza e attraversa quattro tappe numerate: l'interruttore, l'impilare le decisioni, lo stencil che scorre e il filo della memoria, per poi proseguire verso altre lezioni.</desc>

  <defs>
    <marker id="arrowRoad" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#828282" />
    </marker>
  </defs>

  <text x="240" y="28" fill="#111111" font-size="16" font-weight="bold" text-anchor="middle">Il percorso del libro</text>

  <!-- winding path -->
  <path d="M 50,380 C 90,340 60,300 110,280 S 170,220 190,210 C 230,190 210,150 250,130 S 320,90 340,80 C 370,65 400,55 430,45"
        fill="none" stroke="#828282" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowRoad)" />

  <!-- start flag -->
  <circle cx="50" cy="380" r="14" fill="#eef2f7" stroke="#828282" stroke-width="2" />
  <path d="M50,372 L50,388 M50,372 L58,375 L50,378" fill="none" stroke="#828282" stroke-width="1.5" />
  <text x="50" y="410" fill="#828282" font-size="11" text-anchor="middle">partenza</text>

  <!-- stone 1: interruttore -->
  <circle cx="118" cy="272" r="30" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
  <circle cx="110" cy="272" r="5" fill="none" stroke="#2a7ae2" stroke-width="2" />
  <path d="M110,267 L110,255" fill="none" stroke="#2a7ae2" stroke-width="2" />
  <path d="M116,266 L128,278" fill="none" stroke="#f66a0a" stroke-width="2.5" marker-end="url(#arrowRoad)" />
  <text x="118" y="312" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  <text x="118" y="326" fill="#828282" font-size="10" text-anchor="middle">interruttore</text>

  <!-- stone 2: impilare -->
  <circle cx="205" cy="198" r="30" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
  <g fill="#2a7ae2">
    <rect x="192" y="184" width="26" height="7" rx="2" />
    <rect x="192" y="195" width="26" height="7" rx="2" />
    <rect x="192" y="206" width="26" height="7" rx="2" />
  </g>
  <text x="205" y="238" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  <text x="205" y="252" fill="#828282" font-size="10" text-anchor="middle">impilare</text>

  <!-- stone 3: stencil -->
  <circle cx="297" cy="118" r="30" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
  <g stroke="#2a7ae2" stroke-width="1.2" fill="none">
    <rect x="284" y="105" width="26" height="26" />
    <line x1="284" y1="114" x2="310" y2="114" /><line x1="284" y1="123" x2="310" y2="123" />
    <line x1="293" y1="105" x2="293" y2="131" /><line x1="302" y1="105" x2="302" y2="131" />
  </g>
  <rect x="284" y="105" width="9" height="9" fill="none" stroke="#f66a0a" stroke-width="2" />
  <text x="297" y="158" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  <text x="297" y="172" fill="#828282" font-size="10" text-anchor="middle">stencil</text>

  <!-- stone 4: memoria -->
  <circle cx="393" cy="66" r="30" fill="#dceafc" stroke="#2a7ae2" stroke-width="2" />
  <path d="M383,58 A10,10 0 1 1 383,74" fill="none" stroke="#2a7ae2" stroke-width="2.2" marker-end="url(#arrowRoad)" />
  <circle cx="393" cy="66" r="3" fill="#f66a0a" />
  <text x="393" y="106" fill="#111111" font-size="12" font-weight="bold" text-anchor="middle">4</text>
  <text x="393" y="120" fill="#828282" font-size="10" text-anchor="middle">memoria</text>

  <!-- continuation -->
  <text x="450" y="40" fill="#828282" font-size="16" text-anchor="middle">…</text>

  <text x="240" y="425" fill="#828282" font-size="11" text-anchor="middle">quattro idee, una alla volta, verso il resto del libro</text>
</svg>
