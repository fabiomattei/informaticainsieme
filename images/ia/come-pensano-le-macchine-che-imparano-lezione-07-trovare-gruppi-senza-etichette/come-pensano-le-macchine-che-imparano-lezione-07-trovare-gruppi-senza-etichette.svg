<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l7-title l7-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="l7-title">Punti non etichettati che si organizzano in due gruppi</title>
  <desc id="l7-desc">Un gruppo di punti tutti dello stesso colore, sparsi in due nuvole distinte, ciascuna con un centro segnato da una croce.</desc>

  <rect x="20" y="20" width="440" height="220" rx="10" fill="#fdfdfd" stroke="#e3e3e3" stroke-width="1.5" />

  <circle cx="150" cy="120" r="70" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" />
  <circle cx="340" cy="150" r="65" fill="#fde8d6" stroke="#f66a0a" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" />

  <g fill="#828282">
    <circle cx="120" cy="90" r="7" /><circle cx="160" cy="80" r="7" /><circle cx="180" cy="120" r="7" /><circle cx="130" cy="150" r="7" /><circle cx="170" cy="160" r="7" />
    <circle cx="330" cy="120" r="7" /><circle cx="370" cy="130" r="7" /><circle cx="350" cy="170" r="7" /><circle cx="310" cy="180" r="7" />
  </g>

  <g stroke="#2a7ae2" stroke-width="2.5">
    <line x1="143" y1="120" x2="157" y2="120" /><line x1="150" y1="113" x2="150" y2="127" />
  </g>
  <g stroke="#f66a0a" stroke-width="2.5">
    <line x1="333" y1="150" x2="347" y2="150" /><line x1="340" y1="143" x2="340" y2="157" />
  </g>

  <text x="240" y="252" fill="#828282" font-size="12" text-anchor="middle">nessuna etichetta di partenza: i gruppi emergono dalla sola vicinanza</text>
</svg>
