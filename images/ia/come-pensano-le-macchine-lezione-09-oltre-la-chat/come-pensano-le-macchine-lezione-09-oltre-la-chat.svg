<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title cover-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="cover-title">Oltre la chat</title>
  <desc id="cover-desc">Un nodo centrale che rappresenta il modello è collegato a quattro riquadri periferici: cercare sul web, usare strumenti come una calcolatrice, vedere immagini, e agire in autonomia come un agente.</desc>

  <defs>
    <marker id="arrowChat" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#828282" /></marker>
  </defs>

  <text x="240" y="28" fill="#111111" font-size="17" font-weight="bold" text-anchor="middle">Oltre la chat</text>

  <line x1="240" y1="192" x2="240" y2="110" stroke="#828282" stroke-width="2" marker-end="url(#arrowChat)" />
  <line x1="288" y1="240" x2="360" y2="240" stroke="#828282" stroke-width="2" marker-end="url(#arrowChat)" />
  <line x1="240" y1="288" x2="240" y2="360" stroke="#828282" stroke-width="2" marker-end="url(#arrowChat)" />
  <line x1="192" y1="240" x2="120" y2="240" stroke="#828282" stroke-width="2" marker-end="url(#arrowChat)" />

  <circle cx="240" cy="240" r="48" fill="#dceafc" stroke="#2a7ae2" stroke-width="2.5" />
  <text x="240" y="235" fill="#111111" font-size="13" font-weight="bold" text-anchor="middle">Il modello</text>
  <text x="240" y="252" fill="#111111" font-size="11" text-anchor="middle">(LLM)</text>

  <rect x="165" y="45" width="150" height="65" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2" />
  <circle cx="192" cy="70" r="8" fill="none" stroke="#2a7ae2" stroke-width="2" />
  <line x1="198" y1="76" x2="205" y2="83" stroke="#2a7ae2" stroke-width="2" stroke-linecap="round" />
  <text x="245" y="73" fill="#111111" font-size="12" text-anchor="middle">Cerca sul web</text>
  <text x="245" y="90" fill="#828282" font-size="10" text-anchor="middle">(RAG)</text>

  <rect x="360" y="207" width="100" height="65" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2" />
  <rect x="378" y="222" width="24" height="30" rx="3" fill="none" stroke="#f66a0a" stroke-width="1.5" />
  <line x1="382" y1="229" x2="398" y2="229" stroke="#f66a0a" stroke-width="1.2" />
  <text x="425" y="245" fill="#111111" font-size="11" text-anchor="middle">Usa</text>
  <text x="425" y="259" fill="#111111" font-size="11" text-anchor="middle">strumenti</text>

  <rect x="165" y="365" width="150" height="65" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2" />
  <rect x="185" y="380" width="26" height="20" rx="2" fill="none" stroke="#2a7ae2" stroke-width="1.5" />
  <circle cx="192" cy="386" r="2.5" fill="#2a7ae2" />
  <path d="M186,398 L194,389 L200,394 L210,383" fill="none" stroke="#2a7ae2" stroke-width="1.3" />
  <text x="250" y="395" fill="#111111" font-size="12" text-anchor="middle">Vede immagini</text>
  <text x="250" y="411" fill="#828282" font-size="10" text-anchor="middle">(multimodale)</text>

  <rect x="20" y="207" width="100" height="65" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2" />
  <path d="M 55,225 A 15,15 0 1 1 54,225" fill="none" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowChat)" />
  <text x="70" y="252" fill="#111111" font-size="11" text-anchor="middle">Agisce da</text>
  <text x="70" y="266" fill="#111111" font-size="11" text-anchor="middle">solo (agente)</text>
</svg>
