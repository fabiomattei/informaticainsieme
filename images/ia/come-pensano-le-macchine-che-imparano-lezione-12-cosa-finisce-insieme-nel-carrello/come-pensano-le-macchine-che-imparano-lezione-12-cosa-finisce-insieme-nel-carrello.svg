<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l12a-title l12a-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="l12a-title">Un carrello della spesa con due prodotti che tendono a comparire insieme</title>
  <desc id="l12a-desc">Un'icona di carrello della spesa con due prodotti, pane e latte, evidenziati e collegati da una freccia con la scritta "spesso insieme".</desc>

  <path d="M 100,60 L 130,60 L 155,150 L 340,150 L 360,90 L 145,90" fill="none" stroke="#828282" stroke-width="4" stroke-linejoin="round" />
  <circle cx="175" cy="180" r="12" fill="#828282" />
  <circle cx="320" cy="180" r="12" fill="#828282" />

  <rect x="180" y="95" width="46" height="46" rx="6" fill="#fde8d6" stroke="#f66a0a" stroke-width="2" />
  <text x="203" y="122" fill="#111" font-size="11" text-anchor="middle">pane</text>

  <rect x="270" y="95" width="46" height="46" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2" />
  <text x="293" y="122" fill="#111" font-size="11" text-anchor="middle">latte</text>

  <path d="M 226,118 L 270,118" stroke="#3aa655" stroke-width="2" marker-end="url(#cf)" />
  <defs><marker id="cf" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3aa655" /></marker></defs>

  <text x="248" y="60" fill="#3aa655" font-size="12" text-anchor="middle" font-weight="bold">spesso nello stesso carrello</text>
</svg>
