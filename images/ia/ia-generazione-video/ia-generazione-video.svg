<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>
  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" font-weight="600">Dal testo al video</text>

  <rect x="60" y="44" width="360" height="56" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111" font-weight="600">"Un uomo cammina verso la porta e la apre"</text>
  <text x="240" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">prompt testuale</text>

  <line x1="240" y1="100" x2="240" y2="144" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="130" y="144" width="220" height="66" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#111111" font-weight="600">Diffusione temporale</text>
  <text x="240" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">coerenza tra i fotogrammi</text>

  <line x1="240" y1="210" x2="240" y2="254" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- filmstrip -->
  <g>
    <rect x="60" y="256" width="360" height="70" rx="4" fill="#fdf1e7" stroke="#f66a0a" stroke-width="2"/>
    <line x1="132" y1="256" x2="132" y2="326" stroke="#f66a0a" stroke-width="1.5"/>
    <line x1="204" y1="256" x2="204" y2="326" stroke="#f66a0a" stroke-width="1.5"/>
    <line x1="276" y1="256" x2="276" y2="326" stroke="#f66a0a" stroke-width="1.5"/>
    <line x1="348" y1="256" x2="348" y2="326" stroke="#f66a0a" stroke-width="1.5"/>
    <!-- sprocket holes -->
    <circle cx="72" cy="266" r="3" fill="#f66a0a"/><circle cx="72" cy="316" r="3" fill="#f66a0a"/>
    <circle cx="144" cy="266" r="3" fill="#f66a0a"/><circle cx="144" cy="316" r="3" fill="#f66a0a"/>
    <circle cx="216" cy="266" r="3" fill="#f66a0a"/><circle cx="216" cy="316" r="3" fill="#f66a0a"/>
    <circle cx="288" cy="266" r="3" fill="#f66a0a"/><circle cx="288" cy="316" r="3" fill="#f66a0a"/>
    <circle cx="360" cy="266" r="3" fill="#f66a0a"/><circle cx="360" cy="316" r="3" fill="#f66a0a"/>
    <circle cx="408" cy="266" r="3" fill="#f66a0a"/><circle cx="408" cy="316" r="3" fill="#f66a0a"/>
  </g>

  <text x="240" y="352" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#828282">Sequenza di fotogrammi fisicamente coerenti</text>
</svg>
