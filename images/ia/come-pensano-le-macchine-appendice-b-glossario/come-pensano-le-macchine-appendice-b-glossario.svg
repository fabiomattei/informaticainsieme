<svg viewBox="0 0 460 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title cover-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="cover-title">Una scheda del glossario</title>
  <desc id="cover-desc">Una pila di schedine, con quella in primo piano che mostra il termine "Allucinazione", una breve definizione, e un rimando alla lezione dove viene spiegato per la prima volta, in ordine alfabetico rispetto alle altre schede della pila.</desc>

  <text x="230" y="30" fill="#111111" font-size="17" font-weight="bold" text-anchor="middle">Glossario</text>

  <rect x="88" y="66" width="280" height="150" rx="8" fill="#eef2f7" stroke="#c9c9c9" stroke-width="1.5" />
  <rect x="80" y="58" width="280" height="150" rx="8" fill="#eef2f7" stroke="#c9c9c9" stroke-width="1.5" />

  <rect x="70" y="50" width="290" height="160" rx="8" fill="#ffffff" stroke="#2a7ae2" stroke-width="2.5" />

  <text x="90" y="82" fill="#111111" font-size="15" font-weight="bold">Allucinazione</text>
  <line x1="90" y1="92" x2="340" y2="92" stroke="#828282" stroke-width="1" />

  <text x="90" y="114" fill="#111111" font-size="11.5">Il modello produce con sicurezza</text>
  <text x="90" y="132" fill="#111111" font-size="11.5">un'informazione inventata, con lo</text>
  <text x="90" y="150" fill="#111111" font-size="11.5">stesso stile di un fatto vero. Non è</text>
  <text x="90" y="168" fill="#111111" font-size="11.5">un guasto: è come funziona il</text>
  <text x="90" y="186" fill="#111111" font-size="11.5">meccanismo di previsione.</text>

  <rect x="255" y="192" width="90" height="24" rx="12" fill="#dceafc" stroke="#2a7ae2" stroke-width="1.2" />
  <text x="300" y="208" fill="#1d5eb8" font-size="11" text-anchor="middle">Lezione 8</text>

  <text x="230" y="248" fill="#828282" font-size="12" text-anchor="middle">36 termini, dalla A di "Agente"</text>
  <text x="230" y="266" fill="#828282" font-size="12" text-anchor="middle">alla T di "Transformer"</text>

  <g fill="#2a7ae2">
    <text x="180" y="300" font-size="14" font-weight="bold" text-anchor="middle">A</text>
    <text x="230" y="300" font-size="14" font-weight="bold" text-anchor="middle">B</text>
    <text x="280" y="300" font-size="14" font-weight="bold" text-anchor="middle">···</text>
  </g>
</svg>
