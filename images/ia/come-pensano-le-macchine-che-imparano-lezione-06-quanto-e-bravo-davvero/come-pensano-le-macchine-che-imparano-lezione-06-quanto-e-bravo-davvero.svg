<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l6-title l6-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="l6-title">Una matrice di confusione a quattro caselle</title>
  <desc id="l6-desc">Una tabella due per due che incrocia previsione e realtà: veri positivi, falsi positivi, falsi negativi, veri negativi.</desc>

  <text x="240" y="24" fill="#828282" font-size="12" text-anchor="middle">realtà</text>
  <text x="30" y="150" fill="#828282" font-size="12" text-anchor="middle" transform="rotate(-90 30 150)">previsione</text>

  <text x="170" y="46" fill="#111" font-size="11" text-anchor="middle">malato</text>
  <text x="310" y="46" fill="#111" font-size="11" text-anchor="middle">sano</text>
  <text x="90" y="105" fill="#111" font-size="11" text-anchor="middle">malato</text>
  <text x="90" y="195" fill="#111" font-size="11" text-anchor="middle">sano</text>

  <rect x="100" y="60" width="140" height="80" fill="#e5f4ea" stroke="#3aa655" stroke-width="1.5" />
  <text x="170" y="95" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">vero positivo</text>
  <text x="170" y="112" fill="#828282" font-size="10" text-anchor="middle">giusto</text>

  <rect x="240" y="60" width="140" height="80" fill="#fbe4e4" stroke="#c0392b" stroke-width="1.5" />
  <text x="310" y="95" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">falso positivo</text>
  <text x="310" y="112" fill="#828282" font-size="10" text-anchor="middle">falso allarme</text>

  <rect x="100" y="140" width="140" height="80" fill="#fbe4e4" stroke="#c0392b" stroke-width="1.5" />
  <text x="170" y="175" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">falso negativo</text>
  <text x="170" y="192" fill="#828282" font-size="10" text-anchor="middle">malattia mancata</text>

  <rect x="240" y="140" width="140" height="80" fill="#e5f4ea" stroke="#3aa655" stroke-width="1.5" />
  <text x="310" y="175" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">vero negativo</text>
  <text x="310" y="192" fill="#828282" font-size="10" text-anchor="middle">giusto</text>
</svg>
