<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f66a0a"/>
    </marker>
  </defs>
  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Richiesta POST a Flask</text>

  <!-- browser box -->
  <rect x="30" y="55" width="170" height="140" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <rect x="30" y="55" width="170" height="22" rx="6" fill="#2a7ae2"/>
  <circle cx="44" cy="66" r="3" fill="#ffffff"/>
  <circle cx="54" cy="66" r="3" fill="#ffffff"/>
  <circle cx="64" cy="66" r="3" fill="#ffffff"/>
  <text x="115" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff">Browser</text>

  <text x="45" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#111111">name:</text>
  <rect x="90" y="88" width="90" height="16" rx="3" fill="#ffffff" stroke="#828282" stroke-width="1"/>
  <text x="95" y="100" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#111111">gino</text>

  <text x="45" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#111111">password:</text>
  <rect x="105" y="112" width="75" height="16" rx="3" fill="#ffffff" stroke="#828282" stroke-width="1"/>
  <text x="110" y="124" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#111111">••••</text>

  <rect x="90" y="140" width="70" height="24" rx="4" fill="#f66a0a"/>
  <text x="125" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff">submit</text>

  <!-- flask server box -->
  <rect x="280" y="55" width="170" height="140" rx="6" fill="#1e1e1e"/>
  <text x="365" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="600">Flask /login</text>
  <text x="298" y="105" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#7fd9ff">methods=[POST,GET]</text>
  <text x="298" y="128" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#ffffff">request.form['name']</text>
  <text x="298" y="146" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#ffffff">request.form['password']</text>
  <text x="298" y="170" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#f66a0a">if credenziali valide...</text>

  <!-- arrows -->
  <line x1="200" y1="100" x2="278" y2="100" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2a7ae2">POST</text>

  <line x1="278" y1="150" x2="200" y2="150" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="240" y="167" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#f66a0a">HTML risposta</text>

  <!-- result boxes -->
  <rect x="60" y="230" width="160" height="50" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="140" y="252" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#111111">login.html</text>
  <text x="140" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">credenziali errate</text>

  <rect x="260" y="230" width="160" height="50" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2"/>
  <text x="340" y="252" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#111111">paginasegreta.html</text>
  <text x="340" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#828282">credenziali corrette</text>

  <text x="240" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">GET: dati nella URL · POST: dati nel form</text>
</svg>
