<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#828282"/>
    </marker>
  </defs>

  <text x="230" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">1..5  (estremi inclusi)</text>

  <!-- number line -->
  <line x1="30" y1="70" x2="430" y2="70" stroke="#828282" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="12" fill="#828282" text-anchor="middle">
    <text x="30"  y="95">0</text>
    <text x="100" y="95">1</text>
    <text x="170" y="95">2</text>
    <text x="240" y="95">3</text>
    <text x="310" y="95">4</text>
    <text x="380" y="95">5</text>
  </g>
  <!-- highlighted segment 1..5 -->
  <line x1="100" y1="70" x2="380" y2="70" stroke="#2a7ae2" stroke-width="6"/>
  <circle cx="100" cy="70" r="7" fill="#2a7ae2"/>
  <circle cx="380" cy="70" r="7" fill="#2a7ae2"/>
  <text x="100" y="55" text-anchor="middle" font-size="11" fill="#2a7ae2">incluso</text>
  <text x="380" y="55" text-anchor="middle" font-size="11" fill="#2a7ae2">incluso</text>

  <text x="230" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">1...5  (estremo finale escluso)</text>

  <line x1="30" y1="185" x2="430" y2="185" stroke="#828282" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="12" fill="#828282" text-anchor="middle">
    <text x="30"  y="210">0</text>
    <text x="100" y="210">1</text>
    <text x="170" y="210">2</text>
    <text x="240" y="210">3</text>
    <text x="310" y="210">4</text>
    <text x="380" y="210">5</text>
  </g>
  <line x1="100" y1="185" x2="310" y2="185" stroke="#f66a0a" stroke-width="6"/>
  <circle cx="100" cy="185" r="7" fill="#f66a0a"/>
  <circle cx="380" cy="185" r="7" fill="none" stroke="#f66a0a" stroke-width="2"/>
  <text x="380" y="235" text-anchor="middle" font-size="11" fill="#f66a0a">escluso</text>
</svg>
