<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f66a0a"/>
    </marker>
  </defs>

  <text x="230" y="30" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">def raddoppia(numero)</text>

  <!-- input arrow -->
  <rect x="20" y="90" width="110" height="50" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="75" y="120" text-anchor="middle" font-size="15" fill="#111111">numero = 5</text>

  <line x1="130" y1="115" x2="175" y2="115" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="152" y="105" text-anchor="middle" font-size="11" fill="#828282">argomento</text>

  <!-- black box -->
  <rect x="175" y="70" width="130" height="90" rx="6" fill="#111111" stroke="#111111" stroke-width="2"/>
  <text x="240" y="105" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">raddoppia</text>
  <text x="240" y="128" text-anchor="middle" font-size="12" fill="#eef2f7">numero * 2</text>

  <line x1="305" y1="115" x2="350" y2="115" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="327" y="105" text-anchor="middle" font-size="11" fill="#828282">return</text>

  <rect x="350" y="90" width="90" height="50" rx="6" fill="#fff3ea" stroke="#f66a0a" stroke-width="2"/>
  <text x="395" y="120" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">10</text>

  <text x="230" y="200" text-anchor="middle" font-size="13" fill="#828282">risultato = raddoppia(5)  →  risultato vale 10</text>
  <text x="230" y="222" text-anchor="middle" font-size="12" fill="#828282">i parametri entrano, il valore di ritorno esce</text>
</svg>
