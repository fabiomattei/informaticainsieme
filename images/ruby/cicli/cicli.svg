<svg viewBox="0 0 420 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f66a0a"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="150" y="15" width="120" height="40" rx="20" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="210" y="40" text-anchor="middle" font-size="14" fill="#111111">inizio</text>

  <line x1="210" y1="55" x2="210" y2="85" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- condition diamond -->
  <polygon points="210,85 300,140 210,195 120,140" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="210" y="135" text-anchor="middle" font-size="13" fill="#111111">while cond</text>
  <text x="210" y="152" text-anchor="middle" font-size="13" fill="#111111">until !cond</text>

  <!-- vera -> body -->
  <line x1="210" y1="195" x2="210" y2="230" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="228" y="215" font-size="13" fill="#828282">vera</text>

  <rect x="130" y="230" width="160" height="60" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="210" y="255" text-anchor="middle" font-size="14" fill="#111111">corpo del ciclo</text>
  <text x="210" y="273" text-anchor="middle" font-size="12" fill="#828282">puts, acc += i, ...</text>

  <!-- back to condition -->
  <path d="M130 260 C60 260 60 140 118 140" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- next: skip -->
  <path d="M290 245 C 350 200 340 150 300 140" fill="none" stroke="#828282" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="345" y="185" font-size="12" fill="#828282">next</text>

  <!-- break -->
  <path d="M290 275 C 380 300 380 360 300 375" fill="none" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="345" y="330" font-size="12" fill="#f66a0a">break</text>

  <!-- falsa -> fine -->
  <line x1="120" y1="140" x2="90" y2="140" stroke="#2a7ae2" stroke-width="2"/>
  <path d="M90 140 L90 375 L150 375" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="130" font-size="13" fill="#828282">falsa</text>

  <rect x="150" y="355" width="120" height="40" rx="20" fill="#fff3ea" stroke="#f66a0a" stroke-width="2"/>
  <text x="210" y="380" text-anchor="middle" font-size="14" fill="#111111">fine</text>
</svg>
