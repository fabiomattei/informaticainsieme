<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <!-- hash describing the label -->
  <rect x="15" y="20" width="190" height="180" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="110" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">mylabel = { ... }</text>
  <g font-size="12" fill="#111111">
    <text x="28" y="65">x: 320</text>
    <text x="28" y="84">y: 640</text>
    <text x="28" y="103">text: "punteggio: 10"</text>
    <text x="28" y="122">anchor_x: 0.5</text>
    <text x="28" y="141">anchor_y: 0.5</text>
    <text x="28" y="160" fill="#f66a0a">r: 0, g: 0, b: 0, a: 255</text>
    <text x="28" y="179">size_px: 20</text>
  </g>

  <line x1="205" y1="110" x2="255" y2="110" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="98" text-anchor="middle" font-size="11" fill="#828282">args.outputs.labels &lt;&lt;</text>

  <!-- screen -->
  <rect x="255" y="20" width="190" height="180" rx="6" fill="#111111" stroke="#111111" stroke-width="2"/>
  <text x="350" y="35" text-anchor="middle" font-size="11" fill="#828282">schermo</text>

  <!-- anchor point -->
  <circle cx="350" cy="110" r="3" fill="#f66a0a"/>
  <line x1="335" y1="110" x2="365" y2="110" stroke="#f66a0a" stroke-width="1"/>
  <line x1="350" y1="95" x2="350" y2="125" stroke="#f66a0a" stroke-width="1"/>
  <text x="350" y="140" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">punteggio: 10</text>
  <text x="350" y="160" text-anchor="middle" font-size="10" fill="#828282">anchor_x/y = 0.5 → testo centrato sul punto (x,y)</text>

  <text x="230" y="235" text-anchor="middle" font-size="13" fill="#828282">"#{args.state.punteggio}" interpola una variabile nel testo</text>
  <text x="230" y="255" text-anchor="middle" font-size="12" fill="#828282">richiamato ad ogni tick per aggiornare la scritta</text>
</svg>
