<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="230" y="26" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">for i in 1..5</text>

  <!-- sequence of values -->
  <g stroke="#2a7ae2" stroke-width="2" fill="#eef2f7">
    <rect x="30"  y="60" width="60" height="50" rx="6"/>
    <rect x="100" y="60" width="60" height="50" rx="6"/>
    <rect x="170" y="60" width="60" height="50" rx="6" fill="#fff3ea" stroke="#f66a0a"/>
    <rect x="240" y="60" width="60" height="50" rx="6"/>
    <rect x="310" y="60" width="60" height="50" rx="6"/>
  </g>
  <g font-size="18" text-anchor="middle" fill="#111111">
    <text x="60"  y="92">1</text>
    <text x="130" y="92">2</text>
    <text x="200" y="92" fill="#f66a0a" font-weight="bold">3</text>
    <text x="270" y="92">4</text>
    <text x="340" y="92">5</text>
  </g>

  <!-- cursor arrow pointing to current element, dropping into body -->
  <path d="M200 112 L200 150" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="130" text-anchor="middle" font-size="11" fill="#f66a0a">i</text>

  <rect x="130" y="150" width="140" height="45" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="200" y="178" text-anchor="middle" font-size="14" fill="#111111">puts i</text>

  <!-- forward progression arrows -->
  <path d="M90 85 C 95 85 95 85 100 85" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M160 85 C 165 85 165 85 170 85" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M230 85 C 235 85 235 85 240 85" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M300 85 C 305 85 305 85 310 85" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="230" y="225" text-anchor="middle" font-size="13" fill="#828282">Ruby avanza automaticamente da un elemento al successivo</text>
</svg>
