<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <!-- class box -->
  <rect x="140" y="15" width="200" height="130" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Alunno</text>
  <line x1="150" y1="48" x2="330" y2="48" stroke="#2a7ae2" stroke-width="1"/>
  <text x="155" y="68" font-size="13" fill="#111111">@nome</text>
  <text x="155" y="86" font-size="13" fill="#111111">@cognome</text>
  <line x1="150" y1="96" x2="330" y2="96" stroke="#2a7ae2" stroke-width="1"/>
  <text x="155" y="116" font-size="13" fill="#111111">saluta()</text>
  <text x="155" y="134" font-size="12" fill="#828282">initialize(nome, cognome)</text>

  <text x="240" y="180" text-anchor="middle" font-size="13" fill="#828282">.new(...) crea istanze</text>

  <!-- arrows to instances -->
  <path d="M210 145 C 170 190 120 210 120 225" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M270 145 C 320 190 370 210 370 225" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- instance 1 -->
  <rect x="30" y="225" width="180" height="100" rx="6" fill="#ffffff" stroke="#2a7ae2" stroke-width="2"/>
  <text x="120" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">mario :Alunno</text>
  <line x1="40" y1="258" x2="200" y2="258" stroke="#2a7ae2" stroke-width="1"/>
  <text x="45" y="278" font-size="13" fill="#111111">@nome = "Mario"</text>
  <text x="45" y="296" font-size="13" fill="#111111">@cognome = "Rossi"</text>
  <text x="45" y="314" font-size="12" fill="#828282">saluta → "Ciao, Mario Rossi"</text>

  <!-- instance 2 -->
  <rect x="270" y="225" width="180" height="100" rx="6" fill="#ffffff" stroke="#2a7ae2" stroke-width="2"/>
  <text x="360" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">rita :Alunno</text>
  <line x1="280" y1="258" x2="440" y2="258" stroke="#2a7ae2" stroke-width="1"/>
  <text x="285" y="278" font-size="13" fill="#111111">@nome = "Rita"</text>
  <text x="285" y="296" font-size="13" fill="#111111">@cognome = "Morelli"</text>
  <text x="285" y="314" font-size="12" fill="#f66a0a">stesso metodo, dati diversi</text>

  <text x="240" y="355" text-anchor="middle" font-size="13" fill="#828282">una classe, tante istanze con valori propri</text>
</svg>
