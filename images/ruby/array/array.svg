<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="240" y="28" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">lettere = ['a','b','c','d','e']</text>

  <!-- boxes -->
  <g stroke="#2a7ae2" stroke-width="2" fill="#eef2f7">
    <rect x="40"  y="80" width="70" height="60" rx="6"/>
    <rect x="110" y="80" width="70" height="60" rx="6"/>
    <rect x="180" y="80" width="70" height="60" rx="6" fill="#fff3ea" stroke="#f66a0a"/>
    <rect x="250" y="80" width="70" height="60" rx="6"/>
    <rect x="320" y="80" width="70" height="60" rx="6"/>
  </g>

  <g font-size="20" text-anchor="middle" fill="#111111">
    <text x="75"  y="118">'a'</text>
    <text x="145" y="118">'b'</text>
    <text x="215" y="118" fill="#f66a0a" font-weight="bold">'c'</text>
    <text x="285" y="118">'d'</text>
    <text x="355" y="118">'e'</text>
  </g>

  <!-- positive indices -->
  <g font-size="14" text-anchor="middle" fill="#828282">
    <text x="75"  y="160">0</text>
    <text x="145" y="160">1</text>
    <text x="215" y="160" fill="#f66a0a" font-weight="bold">2</text>
    <text x="285" y="160">3</text>
    <text x="355" y="160">4</text>
  </g>

  <!-- negative indices -->
  <g font-size="14" text-anchor="middle" fill="#828282">
    <text x="75"  y="68">-5</text>
    <text x="145" y="68">-4</text>
    <text x="215" y="68">-3</text>
    <text x="285" y="68">-2</text>
    <text x="355" y="68">-1</text>
  </g>

  <text x="240" y="195" text-anchor="middle" font-size="14" fill="#828282">indice positivo dall'inizio, negativo dalla fine</text>

  <!-- callout -->
  <path d="M215 140 L215 220" stroke="#f66a0a" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
  <text x="215" y="240" text-anchor="middle" font-size="15" fill="#f66a0a" font-weight="bold">lettere[2] → 'c'</text>
  <text x="215" y="260" text-anchor="middle" font-size="15" fill="#f66a0a" font-weight="bold">lettere[-3] → 'c'</text>
</svg>
