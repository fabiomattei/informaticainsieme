<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7ae2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f66a0a"/>
    </marker>
  </defs>

  <!-- map row -->
  <text x="15" y="30" font-size="14" fill="#111111" font-weight="bold">.map { |n| n * 2 }</text>
  <rect x="15" y="40" width="130" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="80" y="62" text-anchor="middle" font-size="12" fill="#111111">[1, 2, 3, 4, 5]</text>
  <line x1="145" y1="57" x2="195" y2="57" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="195" y="40" width="150" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#111111">[2, 4, 6, 8, 10]</text>
  <text x="415" y="62" font-size="11" fill="#828282">stessa lunghezza</text>

  <!-- select row -->
  <text x="15" y="120" font-size="14" fill="#111111" font-weight="bold">.select { |n| n.even? }</text>
  <rect x="15" y="130" width="130" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="80" y="152" text-anchor="middle" font-size="12" fill="#111111">[1, 2, 3, 4, 5]</text>
  <line x1="145" y1="147" x2="195" y2="147" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="195" y="130" width="90" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="240" y="152" text-anchor="middle" font-size="12" fill="#111111">[2, 4]</text>
  <text x="380" y="152" font-size="11" fill="#828282">array più piccolo</text>

  <!-- reduce row -->
  <text x="15" y="210" font-size="14" fill="#111111" font-weight="bold">.reduce(0) { |acc, n| acc + n }</text>
  <rect x="15" y="220" width="130" height="34" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="80" y="242" text-anchor="middle" font-size="12" fill="#111111">[1, 2, 3, 4, 5]</text>
  <line x1="145" y1="237" x2="195" y2="237" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="195" y="220" width="70" height="34" rx="6" fill="#fff3ea" stroke="#f66a0a" stroke-width="2"/>
  <text x="230" y="242" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">15</text>
  <text x="330" y="242" font-size="11" fill="#828282">un solo valore</text>

  <!-- chaining -->
  <text x="240" y="300" text-anchor="middle" font-size="13" fill="#828282">select → map → reduce si incatenano</text>
  <text x="240" y="320" text-anchor="middle" font-size="12" fill="#828282">il risultato di uno diventa l'input del successivo</text>
  <path d="M100 335 C 180 355 300 355 380 335" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
