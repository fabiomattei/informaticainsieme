<svg viewBox="0 0 460 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <!-- center node -->
  <rect x="175" y="145" width="110" height="50" rx="6" fill="#f66a0a" stroke="#f66a0a" stroke-width="2"/>
  <text x="230" y="176" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">Operatori</text>

  <!-- Aritmetici -->
  <rect x="20" y="20" width="150" height="70" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="95" y="40" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Aritmetici</text>
  <text x="95" y="58" text-anchor="middle" font-size="11" fill="#828282">+  -  *  /  %  **</text>
  <text x="95" y="74" text-anchor="middle" font-size="11" fill="#828282">3 / 2 → 1</text>
  <line x1="140" y1="90" x2="195" y2="148" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Confronto -->
  <rect x="290" y="20" width="150" height="70" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="365" y="40" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Confronto</text>
  <text x="365" y="58" text-anchor="middle" font-size="11" fill="#828282">==  &lt;  &gt;  &lt;=  &gt;=</text>
  <text x="365" y="74" text-anchor="middle" font-size="11" fill="#828282">3 &lt;=&gt; 4 → -1</text>
  <line x1="320" y1="90" x2="265" y2="148" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Logici -->
  <rect x="20" y="250" width="150" height="70" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="95" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Logici</text>
  <text x="95" y="288" text-anchor="middle" font-size="11" fill="#828282">&amp;&amp;  ||  !</text>
  <text x="95" y="304" text-anchor="middle" font-size="11" fill="#828282">and, or, not</text>
  <line x1="140" y1="250" x2="195" y2="192" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Assegnamento -->
  <rect x="290" y="250" width="150" height="70" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="365" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Assegnamento</text>
  <text x="365" y="288" text-anchor="middle" font-size="11" fill="#828282">=  +=  -=  *=  /=</text>
  <text x="365" y="304" text-anchor="middle" font-size="11" fill="#828282">a, b = b, a</text>
  <line x1="320" y1="250" x2="265" y2="192" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
