<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- code anatomy -->
  <text x="30" y="40" font-size="20" font-family="monospace" fill="#111111">def</text>
  <text x="75" y="40" font-size="20" font-family="monospace" fill="#111111">somma</text>
  <text x="165" y="40" font-size="20" font-family="monospace" fill="#111111">(a, b)</text>

  <line x1="35" y1="50" x2="60" y2="50" stroke="#2a7ae2" stroke-width="2"/>
  <text x="47" y="70" text-anchor="middle" font-size="11" fill="#2a7ae2">keyword</text>

  <line x1="75" y1="50" x2="155" y2="50" stroke="#2a7ae2" stroke-width="2"/>
  <text x="115" y="70" text-anchor="middle" font-size="11" fill="#2a7ae2">nome metodo</text>

  <line x1="165" y1="50" x2="240" y2="50" stroke="#f66a0a" stroke-width="2"/>
  <text x="200" y="70" text-anchor="middle" font-size="11" fill="#f66a0a">parametri</text>

  <text x="30" y="105" font-size="20" font-family="monospace" fill="#111111">  a + b</text>
  <line x1="35" y1="115" x2="145" y2="115" stroke="#828282" stroke-width="2"/>
  <text x="90" y="135" text-anchor="middle" font-size="11" fill="#828282">corpo (return implicito)</text>

  <text x="30" y="170" font-size="20" font-family="monospace" fill="#111111">end</text>
  <line x1="30" y1="180" x2="65" y2="180" stroke="#2a7ae2" stroke-width="2"/>
  <text x="47" y="200" text-anchor="middle" font-size="11" fill="#2a7ae2">chiusura blocco</text>

  <!-- separator -->
  <line x1="15" y1="220" x2="465" y2="220" stroke="#828282" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- variable prefix legend -->
  <text x="240" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Prefissi e visibilità</text>

  <g font-family="monospace" font-size="14">
    <rect x="20" y="260" width="90" height="30" rx="5" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <text x="65" y="280" text-anchor="middle" fill="#111111">nome</text>

    <rect x="125" y="260" width="90" height="30" rx="5" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <text x="170" y="280" text-anchor="middle" fill="#111111">@nome</text>

    <rect x="230" y="260" width="95" height="30" rx="5" fill="#eef2f7" stroke="#2a7ae2" stroke-width="1.5"/>
    <text x="277" y="280" text-anchor="middle" fill="#111111">@@nome</text>

    <rect x="340" y="260" width="90" height="30" rx="5" fill="#fff3ea" stroke="#f66a0a" stroke-width="1.5"/>
    <text x="385" y="280" text-anchor="middle" fill="#111111">$nome</text>
  </g>
  <g font-size="10" fill="#828282" text-anchor="middle">
    <text x="65" y="305">locale</text>
    <text x="170" y="305">istanza</text>
    <text x="277" y="305">classe</text>
    <text x="385" y="305">globale</text>
  </g>
</svg>
