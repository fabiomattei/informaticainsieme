<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7ae2"/>
    </marker>
  </defs>
  <text x="240" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">La palla si muove con la tastiera</text>

  <!-- game window -->
  <rect x="40" y="48" width="400" height="180" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <rect x="40" y="48" width="400" height="24" rx="6" fill="#2a7ae2"/>
  <circle cx="56" cy="60" r="4" fill="#ffffff"/>
  <circle cx="70" cy="60" r="4" fill="#ffffff"/>
  <circle cx="84" cy="60" r="4" fill="#ffffff"/>
  <text x="240" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff">Move Keyboard Example</text>

  <!-- ball centered -->
  <circle cx="240" cy="150" r="18" fill="#f66a0a"/>

  <!-- directional arrows -->
  <line x1="240" y1="128" x2="240" y2="95" stroke="#2a7ae2" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="240" y1="172" x2="240" y2="205" stroke="#2a7ae2" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="218" y1="150" x2="180" y2="150" stroke="#2a7ae2" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="262" y1="150" x2="300" y2="150" stroke="#2a7ae2" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- keyboard arrow keys -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#111111">
    <rect x="215" y="255" width="34" height="30" rx="5" fill="#ffffff" stroke="#828282" stroke-width="2"/>
    <text x="232" y="276" text-anchor="middle">&#8593;</text>

    <rect x="180" y="290" width="34" height="30" rx="5" fill="#ffffff" stroke="#828282" stroke-width="2"/>
    <text x="197" y="311" text-anchor="middle">&#8592;</text>

    <rect x="215" y="290" width="34" height="30" rx="5" fill="#ffffff" stroke="#828282" stroke-width="2"/>
    <text x="232" y="311" text-anchor="middle">&#8595;</text>

    <rect x="250" y="290" width="34" height="30" rx="5" fill="#ffffff" stroke="#828282" stroke-width="2"/>
    <text x="267" y="311" text-anchor="middle">&#8594;</text>
  </g>

  <text x="240" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#828282">on_key_press / on_key_release</text>

  <rect x="335" y="255" width="120" height="65" rx="6" fill="#1e1e1e"/>
  <text x="345" y="275" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#ffffff">change_x</text>
  <text x="345" y="292" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#ffffff">change_y</text>
  <text x="345" y="309" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#f66a0a">MOVEMENT_SPEED</text>
</svg>
