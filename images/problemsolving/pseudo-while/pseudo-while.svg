<svg viewBox="0 0 360 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="180" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Ciclo while</text>

  <line x1="180" y1="40" x2="180" y2="65" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- condition diamond -->
  <polygon points="180,65 260,113 180,161 100,113" fill="white" stroke="#2a7ae2" stroke-width="2"/>
  <text x="180" y="118" text-anchor="middle" font-size="13" fill="#111111">condizione?</text>

  <line x1="180" y1="161" x2="180" y2="191" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="178" font-size="11" fill="#828282">vero</text>

  <!-- loop body -->
  <rect x="80" y="193" width="200" height="46" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2.5"/>
  <text x="180" y="221" text-anchor="middle" font-size="14" fill="#111111">corpo del ciclo</text>

  <!-- loop back arrow -->
  <path d="M 280 216 C 330 216, 330 113, 260 113" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- exit -->
  <line x1="100" y1="113" x2="45" y2="113" stroke="#828282" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="55" y="101" text-anchor="middle" font-size="11" fill="#828282">falso</text>
  <rect x="5" y="118" width="80" height="36" rx="6" fill="white" stroke="#828282" stroke-width="1.5"/>
  <text x="45" y="141" text-anchor="middle" font-size="12" fill="#828282">fine</text>

  <text x="180" y="290" text-anchor="middle" font-size="13" fill="#828282">la condizione è verificata</text>
  <text x="180" y="308" text-anchor="middle" font-size="13" fill="#828282">prima di ogni esecuzione del corpo:</text>
  <text x="180" y="326" text-anchor="middle" font-size="13" fill="#828282">se falsa fin dall'inizio, il corpo non gira mai</text>
</svg>
