<svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="170" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Il braccio meccanico: stato [E,30°]</text>

  <g transform="translate(170,180)">
    <circle r="120" fill="white" stroke="#828282" stroke-width="1.5"/>
    <!-- 12 sector lines every 30 degrees -->
    <g stroke="#dddddd" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-120"/>
      <line x1="0" y1="0" x2="60" y2="-103.9"/>
      <line x1="0" y1="0" x2="103.9" y2="-60"/>
      <line x1="0" y1="0" x2="120" y2="0"/>
      <line x1="0" y1="0" x2="103.9" y2="60"/>
      <line x1="0" y1="0" x2="60" y2="103.9"/>
      <line x1="0" y1="0" x2="0" y2="120"/>
      <line x1="0" y1="0" x2="-60" y2="103.9"/>
      <line x1="0" y1="0" x2="-103.9" y2="60"/>
      <line x1="0" y1="0" x2="-120" y2="0"/>
      <line x1="0" y1="0" x2="-103.9" y2="-60"/>
      <line x1="0" y1="0" x2="-60" y2="-103.9"/>
    </g>
    <!-- cardinal points -->
    <text x="0" y="-130" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">N</text>
    <text x="140" y="5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">E</text>
    <text x="0" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">S</text>
    <text x="-140" y="5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">W</text>

    <!-- arm pointing at E + 30 degrees clockwise (state [E,30]) -->
    <line x1="0" y1="0" x2="103.9" y2="60" stroke="#f66a0a" stroke-width="4"/>
    <circle cx="103.9" cy="60" r="6" fill="#f66a0a"/>
    <text x="118" y="78" font-size="12" fill="#f66a0a">[E,30°]</text>

    <circle r="3" fill="#111111"/>
  </g>

  <text x="170" y="320" text-anchor="middle" font-size="13" fill="#828282">il cerchio è diviso in 12 settori da 30°, come le ore di un orologio</text>
</svg>
