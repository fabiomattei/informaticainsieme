<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Il problema dell'illuminazione</text>

  <!-- hexagon nodes p1..p6, plus diagonal p1-p4 -->
  <!-- edges -->
  <line x1="240" y1="70"  x2="380" y2="150" stroke="#828282" stroke-width="2"/>
  <line x1="380" y1="150" x2="380" y2="260" stroke="#828282" stroke-width="2"/>
  <line x1="380" y1="260" x2="240" y2="330" stroke="#828282" stroke-width="2"/>
  <line x1="240" y1="330" x2="100" y2="260" stroke="#828282" stroke-width="2"/>
  <line x1="100" y1="260" x2="100" y2="150" stroke="#828282" stroke-width="2"/>
  <line x1="100" y1="150" x2="240" y2="70"  stroke="#828282" stroke-width="2"/>
  <line x1="240" y1="70"  x2="240" y2="330" stroke="#2a7ae2" stroke-width="2.5"/>

  <!-- p1 (top) -->
  <circle cx="240" cy="70" r="26" fill="#fff3e8" stroke="#f66a0a" stroke-width="3"/>
  <text x="240" y="76" text-anchor="middle" font-size="14" fill="#111111">p1</text>

  <!-- p2 -->
  <circle cx="380" cy="150" r="24" fill="white" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="380" y="156" text-anchor="middle" font-size="14" fill="#111111">p2</text>

  <!-- p3 -->
  <circle cx="380" cy="260" r="24" fill="white" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="380" y="266" text-anchor="middle" font-size="14" fill="#111111">p3</text>

  <!-- p4 (bottom) -->
  <circle cx="240" cy="330" r="26" fill="#fff3e8" stroke="#f66a0a" stroke-width="3"/>
  <text x="240" y="336" text-anchor="middle" font-size="14" fill="#111111">p4</text>

  <!-- p5 -->
  <circle cx="100" cy="260" r="24" fill="white" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="100" y="266" text-anchor="middle" font-size="14" fill="#111111">p5</text>

  <!-- p6 -->
  <circle cx="100" cy="150" r="24" fill="white" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="100" y="156" text-anchor="middle" font-size="14" fill="#111111">p6</text>

  <text x="240" y="365" text-anchor="middle" font-size="13" fill="#828282">due lampioni in p1 e p4 (in arancione) illuminano tutte le piazze</text>
</svg>
