<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Coda: FIFO (First In First Out)</text>

  <!-- queue boxes -->
  <rect x="330" y="70" width="55" height="55" fill="#fff3e8" stroke="#f66a0a" stroke-width="2.5"/>
  <text x="357" y="103" text-anchor="middle" font-size="16" fill="#111111">D</text>

  <rect x="265" y="70" width="55" height="55" fill="white" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="292" y="103" text-anchor="middle" font-size="16" fill="#111111">C</text>

  <rect x="200" y="70" width="55" height="55" fill="white" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="227" y="103" text-anchor="middle" font-size="16" fill="#111111">B</text>

  <rect x="135" y="70" width="55" height="55" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="162" y="103" text-anchor="middle" font-size="16" fill="#111111">A</text>

  <!-- entry arrow (right) -->
  <line x1="440" y1="97" x2="390" y2="97" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrowq)"/>
  <text x="440" y="75" text-anchor="middle" font-size="12" fill="#828282">arrivi</text>

  <!-- exit arrow (left) -->
  <line x1="130" y1="97" x2="80" y2="97" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowq)"/>
  <text x="80" y="75" text-anchor="middle" font-size="12" fill="#f66a0a">servito</text>

  <text x="240" y="170" text-anchor="middle" font-size="13" fill="#828282">A è arrivato per primo: sarà il primo ad essere servito</text>
</svg>
