<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Pila: LIFO (Last In First Out)</text>

  <!-- stack boxes, bottom to top -->
  <rect x="190" y="220" width="100" height="45" fill="white" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="240" y="248" text-anchor="middle" font-size="15" fill="#111111">Elisa</text>

  <rect x="190" y="175" width="100" height="45" fill="white" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="240" y="203" text-anchor="middle" font-size="15" fill="#111111">Dario</text>

  <rect x="190" y="130" width="100" height="45" fill="white" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="240" y="158" text-anchor="middle" font-size="15" fill="#111111">Carla</text>

  <rect x="190" y="85" width="100" height="45" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="240" y="113" text-anchor="middle" font-size="15" fill="#111111">Bruno</text>

  <rect x="190" y="40" width="100" height="45" fill="#fff3e8" stroke="#f66a0a" stroke-width="3"/>
  <text x="240" y="68" text-anchor="middle" font-size="15" fill="#111111">Anna</text>

  <!-- push arrow -->
  <line x1="340" y1="130" x2="300" y2="60" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrowp)"/>
  <text x="360" y="120" text-anchor="middle" font-size="12" fill="#2a7ae2">push</text>

  <!-- pop arrow -->
  <line x1="140" y1="60" x2="180" y2="60" stroke="#f66a0a" stroke-width="2" marker-end="url(#arrowp)"/>
  <text x="120" y="55" text-anchor="middle" font-size="12" fill="#f66a0a">pop</text>

  <text x="240" y="300" text-anchor="middle" font-size="13" fill="#828282">Anna, in cima alla pila, sarà la prima ad essere estratta (pop)</text>
</svg>
