<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="200" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Una variabile in memoria</text>

  <!-- assignment -->
  <text x="80" y="90" font-size="15" fill="#111111">eta &#8592; 16</text>
  <line x1="150" y1="82" x2="215" y2="82" stroke="#2a7ae2" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- memory box -->
  <rect x="220" y="55" width="150" height="70" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2.5"/>
  <text x="295" y="80" text-anchor="middle" font-size="12" fill="#828282">nome: eta</text>
  <line x1="240" y1="90" x2="350" y2="90" stroke="#828282" stroke-width="1"/>
  <text x="295" y="112" text-anchor="middle" font-size="20" fill="#111111">16</text>

  <text x="295" y="145" text-anchor="middle" font-size="11" fill="#828282">cella di memoria</text>

  <text x="200" y="190" text-anchor="middle" font-size="13" fill="#828282">la variabile associa un nome</text>
  <text x="200" y="208" text-anchor="middle" font-size="13" fill="#828282">ad un valore memorizzato</text>
</svg>
