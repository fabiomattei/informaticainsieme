<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="200" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Istruzione read</text>

  <!-- keyboard/input icon -->
  <rect x="40" y="60" width="120" height="70" rx="6" fill="white" stroke="#828282" stroke-width="2"/>
  <text x="100" y="100" text-anchor="middle" font-size="13" fill="#828282">input utente</text>
  <text x="100" y="118" text-anchor="middle" font-size="16" fill="#111111">"25"</text>

  <!-- read instruction -->
  <line x1="165" y1="95" x2="220" y2="95" stroke="#2a7ae2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="150" y="150" width="100" height="0" fill="none"/>
  <text x="192" y="85" text-anchor="middle" font-size="13" fill="#2a7ae2">read(eta)</text>

  <!-- variable box -->
  <rect x="225" y="60" width="130" height="70" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2.5"/>
  <text x="290" y="90" text-anchor="middle" font-size="12" fill="#828282">variabile: eta</text>
  <text x="290" y="115" text-anchor="middle" font-size="18" fill="#111111">25</text>

  <text x="200" y="180" text-anchor="middle" font-size="13" fill="#828282">l'istruzione read legge un valore</text>
  <text x="200" y="198" text-anchor="middle" font-size="13" fill="#828282">e lo memorizza nella variabile indicata</text>
</svg>
