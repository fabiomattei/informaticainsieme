<svg viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <text x="180" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Ciclo for</text>

  <!-- init -->
  <rect x="90" y="40" width="180" height="42" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="180" y="66" text-anchor="middle" font-size="14" fill="#111111">i = 0</text>

  <line x1="180" y1="82" x2="180" y2="112" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- condition diamond -->
  <polygon points="180,112 260,160 180,208 100,160" fill="white" stroke="#2a7ae2" stroke-width="2"/>
  <text x="180" y="165" text-anchor="middle" font-size="13" fill="#111111">i &lt; N ?</text>

  <line x1="180" y1="208" x2="180" y2="238" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="225" font-size="11" fill="#828282">vero</text>

  <!-- loop body -->
  <rect x="80" y="240" width="200" height="46" rx="6" fill="#eef2f7" stroke="#f66a0a" stroke-width="2.5"/>
  <text x="180" y="268" text-anchor="middle" font-size="14" fill="#111111">corpo del ciclo</text>

  <line x1="180" y1="286" x2="180" y2="316" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- increment -->
  <rect x="90" y="318" width="180" height="42" rx="6" fill="#eef2f7" stroke="#2a7ae2" stroke-width="2"/>
  <text x="180" y="344" text-anchor="middle" font-size="14" fill="#111111">i = i + 1</text>

  <!-- loop back arrow -->
  <path d="M 270 339 C 330 339, 330 160, 260 160" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- exit -->
  <line x1="100" y1="160" x2="55" y2="160" stroke="#828282" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="55" y="148" text-anchor="middle" font-size="11" fill="#828282">falso</text>
  <rect x="15" y="165" width="80" height="36" rx="6" fill="white" stroke="#828282" stroke-width="1.5"/>
  <text x="55" y="188" text-anchor="middle" font-size="12" fill="#828282">fine</text>

  <text x="180" y="400" text-anchor="middle" font-size="13" fill="#828282">inizializzazione, controllo condizione,</text>
  <text x="180" y="418" text-anchor="middle" font-size="13" fill="#828282">corpo e incremento ad ogni iterazione</text>
</svg>
